<!doctype html><!-- 文档类型声明：按 HTML5 标准解析，让浏览器进入标准渲染模式 -->
<html lang="zh-CN"><!-- 根元素：lang 声明简体中文，影响断行规则、字体回退与读屏发音 -->
  <head><!-- 头部区：只放元信息，不渲染可见内容 -->
    <meta charset="UTF-8" /><!-- 字符编码：显式 UTF-8，须落在最前 1024 字节内，故置于一切脚本之前 -->
    <!-- 基础地址：相对资源一律按站点根解析，避免多段路径下把 ./assets 解析到错误目录 -->
    <base href="/" /><!-- 根部署恒为 "/"，子路径部署由下方内联脚本改写 -->
    <script>
      /* 地址栏前置规整：必须在相对路径资源加载前执行，保证按规整后的地址解析资源 */
      (function () { // 立即执行：隔离内部变量，避免污染全局作用域
        if (location.pathname === '/mim' || location.pathname.indexOf('/mim/') === 0) { // 子路径部署兼容
          document.querySelector('base').setAttribute('href', '/mim/'); // 基础地址跟随子路径
        } // 子路径部署兼容处理结束
        var views = ['account', 'deployments', 'community', 'chat', 'circles', 'checkout', 'pay-return', 'signin', 'login', 'profile', 'settings', 'forum', 'announcements', 'news', 'releases', 'cart']; // 对外路径段与旧别名，和 src/router.ts 保持一致
        var href = location.href; // 完整地址：用于判断末位是否残留裸问号
        var search = location.search; // 查询串（含前导问号；无查询串时为空串）
        if (search === '?tads' || (search === '' && href.charAt(href.length - 1) === '?')) { // 命中异常查询串形态
          history.replaceState(null, '', location.pathname + location.hash); // 原地移除查询串，保留路径与 hash
        } // 查询串清理结束：正常查询参数保留原样
        var segs = location.pathname.split('/').filter(Boolean); // 路径拆段并剔除空段
        var keep = false; // true 表示命中需保留的多段详情深链接
        if (segs.length > 1) { // 仅多段路径需要判定
          var cut = 0; // 命中视图段时截到该段的下标
          for (var i = 0; i < segs.length; i++) { // 从头找第一个已知视图段
            if (views.indexOf(segs[i]) >= 0) { // 命中视图段
              cut = i + 1; // 截到视图段为止
              keep = segs[i] === 'community' && (segs[i + 1] === 'post' || segs[i + 1] === 'news'); // 详情深链接不折叠
              break; // 只认第一个视图段
            } // 视图段命中判定结束
          } // 视图段查找结束
          if (!keep) { // 非详情深链接才折叠地址
            var folded; // 折叠后的路径
            if (cut > 0) { // 命中视图段：前缀 + 视图段
              folded = '/' + segs.slice(0, cut).join('/'); // 地址栏统一成单段形态
            } else if (segs[0] === 'mim') { // 未命中视图段且首段为 mim：子路径根
              folded = '/mim/'; // 带尾斜杠回到子路径根
            } else { // 未命中视图段的根部署多段地址
              folded = '/' + segs[0]; // 只保留首段且无尾斜杠
            } // 折叠分支结束
            history.replaceState(null, '', folded + location.hash); // 原地改写地址，保留 hash
          } // 折叠分支结束
        } // 多段判定结束
      })(); // 立即执行结束
    </script><!-- 地址栏前置规整脚本结束 -->
    <script src="%BASE_URL%spa.js"></script><!-- 地址归一化（外置脚本）：构建期替换基础路径，恒解析到 /spa.js -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /><!-- 视口：移动端按设备宽度布局且初始不缩放 -->
    <meta name="color-scheme" content="light dark" /><!-- 配色方案：声明同时支持浅/深色 -->
    <title>Mim</title><!-- 标签页标题：仅产品名 -->
  </head><!-- 元信息结束 -->
  <body><!-- 可见内容容器 -->
    <div id="root"></div><!-- React 挂载点 -->
    <script type="module" src="/src/main.tsx"></script><!-- 入口脚本：type=module 走 ESM -->
  </body><!-- 可见内容结束 -->
</html><!-- 文档结束 -->
