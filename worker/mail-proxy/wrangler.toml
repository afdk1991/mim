name = "mim-mail-proxy"
main = "src/index.ts"
compatibility_date = "2025-03-01"

# 可选：额外放行的 CORS 来源（逗号分隔）。默认已放行 GitHub Pages 与本地 Vite 开发。
# [vars]
# ALLOW_ORIGIN = "https://your-domain.example"

# 机密凭据（可选，配置后前端账号/密码可留空，由服务端注入）：
#   npx wrangler secret put MAIL_USER
#   npx wrangler secret put MAIL_PASS
