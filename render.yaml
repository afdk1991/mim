# Render 免费层配置（Static Site）
# 免费额度：每工作区 750 免费实例小时/月，空闲会休眠、冷启动慢（足够常驻一个小静态站）。
# 在 Render 控制台创建「Static Site」，关联本仓库并指定本文件即可。
# CI 侧 deploy.yml 的 Render 步骤按 Vercel 同款「缺 RENDER_API_KEY 即 SKIP」模式触发已存在服务的部署。

static_sites:
  - name: mim-web
    branch: main
    # 构建前端薄壳产物
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @mim/web build
    # Vite 产物目录
    staticPublishPath: ./apps/web/dist
    # 每个 PR 生成预览环境
    pullRequestPreviewsEnabled: true
