name: Release · 桌面端构建与发布

# 桌面三平台（Windows / macOS / Linux）发布流水线：
# - 大写 V 四段式 tag（如 V0.0.1.0）触发，与 ci-cd.yml 的小写 v* tag 互不干扰
# - tag 第 1.2.4 段注入 tauri.conf.json version（V0.0.0.2 → 0.0.2，桌面 OTA 依赖三段 semver 递增触发更新）
# - matrix 并行构建三平台安装包，tauri-action 自动创建 GitHub Release 并上传产物
# - 配置签名密钥后同步生成 OTA 更新清单 latest.json（Tauri updater 格式）
#   客户端经 https://github.com/afdk1991/mim/releases/latest/download/latest.json 检测更新

on:
  push:
    tags: ['V*.*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # npm install（非 npm ci，lock 不入库）：规避 npm/cli#4828 —— 按运行平台全新解析可选依赖
      # 先升级 npm 到 10.9.9+：npm/cli#7678 arborist edgesOut 崩溃（vite 8 optional peers，旧版 npm 未修复）
      - name: 安装前端依赖
        run: |
          npm install -g npm@10.9.9
          npm install --no-fund --no-audit --legacy-peer-deps

      # 签名私钥以 base64 形式存放（TAURI_SIGNING_PRIVATE_KEY_B64），此处还原为文件，
      # 规避 PowerShell 管道/多行文本在 secret 写入时的换行损坏问题
      - name: 还原签名私钥
        shell: bash
        run: echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}" | base64 -d > "$RUNNER_TEMP/mim.key"

      # 桌面 OTA 版本注入：tauri/npm 只认三段 semver，而版本策略只递增第 4 段（前三段恒 0.0.0），
      # 故映射取「第1.第2.第4段」（V0.0.0.2 → 0.0.2）写入 tauri.conf.json version，
      # tauri-action 以此生成 latest.json 的 version 字段；客户端 updater 按 semver 比较，
      # 三段必须高于已安装版本才触发更新。workflow_dispatch 无 tag 时跳过，保持 0.0.0
      - name: 注入版本号（tag 第 1.2.4 段 → tauri.conf.json）
        if: startsWith(github.ref, 'refs/tags/V')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#V}"
          MAJMIN="${VER%.*}"; MAJMIN="${MAJMIN%.*}"
          VER="$MAJMIN.${VER##*.}"
          echo "tag=$GITHUB_REF_NAME -> tauri version=$VER"
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');" "$VER"
          grep -n '"version"' src-tauri/tauri.conf.json

      # 前端版本号注入：tag 四段式（V0.0.0.2 → 0.0.0.2）写入 src/version.ts，
      # 供页脚展示、欢迎弹窗版本对齐、Android OTA 版本判定使用。
      # 此前该常量恒为 0.0.0.0（CI 从未注入），导致版本显示错误 + OTA 每次误判有更新。
      - name: 注入 APP_VERSION（tag 四段式 → src/version.ts）
        if: startsWith(github.ref, 'refs/tags/V')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#V}"
          node -e "const fs=require('fs');const p='src/version.ts';let s=fs.readFileSync(p,'utf8');s=s.replace(/export const APP_VERSION = '[^']*'/, \"export const APP_VERSION = '\"+process.argv[1]+\"';\");fs.writeFileSync(p,s);" "$VER"
          grep -n "APP_VERSION" src/version.ts

      - name: 构建 & 发布（tauri-action）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/mim.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          # vite build 由 beforeBuildCommand 触发，env 经此透传进前端产物
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Mim ${{ github.ref_name }}'
          releaseBody: 'Mim 桌面端安装包（Windows / macOS / Linux），内含 OTA 自动更新。'
          releaseDraft: false
          prerelease: false

  android:
    name: Android APK & OTA manifest
    # 依赖 desktop 创建 Release 后再上传 APK + manifest.json（tag 触发才发布）
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/V')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Capacitor CLI 要求 Node >=22（vite build 本身 20 即可，但 npx cap sync 在 20 上报 fatal）
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 安装前端依赖
        run: |
          npm install -g npm@10.9.9
          npm install --no-fund --no-audit --legacy-peer-deps
      - name: 注入 APP_VERSION（tag 四段式 → src/version.ts）
        if: startsWith(github.ref, 'refs/tags/V')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#V}"
          node -e "const fs=require('fs');const p='src/version.ts';let s=fs.readFileSync(p,'utf8');s=s.replace(/export const APP_VERSION = '[^']*'/, \"export const APP_VERSION = '\"+process.argv[1]+\"';\");fs.writeFileSync(p,s);" "$VER"
          grep -n "APP_VERSION" src/version.ts

      - name: 构建 Web 资产
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: 还原签名 keystore
        shell: bash
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/mim.keystore"
      - name: 同步 Capacitor & 构建 APK（release 签名）
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/mim.keystore
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: 生成 OTA manifest（tag V0.0.0.0 → version 0.0.0.0）
        run: node scripts/gen-ota-manifest.mjs "${GITHUB_REF_NAME#V}" android/app/build/outputs/apk/release/app-release.apk "$GITHUB_REF_NAME"
      - name: 上传 APK 与 manifest 至 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" android/app/build/outputs/apk/release/app-release.apk manifest.json --clobber --repo "$GITHUB_REPOSITORY"

  ios:
    name: iOS 模拟器构建（免签名冒烟）
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/V')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Capacitor CLI 要求 Node >=22
          node-version: 22
      - name: 安装前端依赖
        run: |
          npm install -g npm@10.9.9
          npm install --no-fund --no-audit --legacy-peer-deps
      - name: 注入 APP_VERSION（tag 四段式 → src/version.ts）
        if: startsWith(github.ref, 'refs/tags/V')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#V}"
          node -e "const fs=require('fs');const p='src/version.ts';let s=fs.readFileSync(p,'utf8');s=s.replace(/export const APP_VERSION = '[^']*'/, \"export const APP_VERSION = '\"+process.argv[1]+\"';\");fs.writeFileSync(p,s);" "$VER"
          grep -n "APP_VERSION" src/version.ts

      - name: 构建 Web 资产
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: 同步 Capacitor iOS 工程
        run: npx cap sync ios
      - name: 模拟器构建（CODE_SIGNING_ALLOWED=NO）
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

  harmony:
    name: HarmonyOS 壳资源同步（WebView rawfile）
    # 鸿蒙端需在 DevEco Studio 本地打包 .hap（GitHub Actions 无 HarmonyOS 构建环境，与 README 一致）。
    # 本 job 负责：构建 Web 资产 → 同步进鸿蒙壳 rawfile → 上传为产物，供本地 DevEco 取用，避免壳内白屏。
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/V')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装前端依赖
        run: |
          npm install -g npm@10.9.9
          npm install --no-fund --no-audit --legacy-peer-deps
      - name: 注入 APP_VERSION（tag 四段式 → src/version.ts）
        if: startsWith(github.ref, 'refs/tags/V')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#V}"
          node -e "const fs=require('fs');const p='src/version.ts';let s=fs.readFileSync(p,'utf8');s=s.replace(/export const APP_VERSION = '[^']*'/, \"export const APP_VERSION = '\"+process.argv[1]+\"';\");fs.writeFileSync(p,s);" "$VER"
          grep -n "APP_VERSION" src/version.ts
      - name: 构建 Web 资产
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: 同步 Web 资源进鸿蒙壳 rawfile
        run: node scripts/sync-harmony.mjs
      - name: 上传 rawfile 产物（供 DevEco 打包 .hap）
        uses: actions/upload-artifact@v4
        with:
          name: harmony-rawfile
          # 必须与 scripts/sync-harmony.mjs 的 dest 完全一致（rawfile 直接位于 resources 下，
          # 而非 resources/base），否则上传的是不存在的目录 → 产物为空 → DevEco 壳内白屏。
          path: harmony/entry/src/main/resources/rawfile
          retention-days: 7
