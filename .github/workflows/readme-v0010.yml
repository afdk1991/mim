name: Readme V0.0.10 sync

on:
  push:
    paths:
      - .github/workflows/readme-v0010.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch README version and admin section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('当前版本：**V0.0.9-preview**', '当前版本：**V0.0.10-preview**', 1)
          s = s.replace('semver 由 `0.0.8` 递增为 `0.0.9`', 'semver 由 `0.0.9` 递增为 `0.0.10`', 1)
          marker = '## V0.0.10 管理端六入口（2026-11-13）'
          if marker not in s:
              s += '\n\n' + marker + '\n\n' + '在既有后台视图上新增批量改价、邀请码、实名审核、内容运营、自研工具、社区运营六个可操作入口；接口全部复用 `/api/v1/admin/*` 与运营域 API 拆分文件 `apps/admin/src/api-ops.ts`。CI run 43411850989 五作业全绿，生产 `/health` 返回 `0.0.10`。\n'
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'Mim CI'
          git config user.email 'ci@mim.local'
          git add README.md
          git commit -m 'docs(readme): 版本与后台六视图同步到 0.0.10 [skip ci]' || true
          git push
      - name: Remove one-shot workflow
        run: |
          git pull --rebase
          git rm .github/workflows/readme-v0010.yml
          git commit -m 'chore(ci): 移除一次性 README 同步工作流 [skip ci]'
          git push
