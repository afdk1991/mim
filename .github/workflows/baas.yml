# 自托管 BaaS 验收流水线
#   job 1  verify   ：离线可跑（shell 语法 / SQL 体检 / 编排一致性 / 函数类型检查）
#   job 2  runtime  ：真起一套栈，跑迁移 + 健康探测 + 库内自检
name: baas

on:
  push:
    paths:
      - 'baas/**'
      - '.github/workflows/baas.yml'
  pull_request:
    paths:
      - 'baas/**'
      - '.github/workflows/baas.yml'
  workflow_dispatch:

jobs:
  verify:
    name: 离线体检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装 TypeScript（供函数类型检查）
        run: npm i --no-save --no-audit --no-fund typescript@5
      - name: verify.mjs
        working-directory: baas
        run: node scripts/verify.mjs
      - name: JWT 签发-验签自检
        working-directory: baas
        run: node scripts/gen-jwt.mjs --secret "ci-only-secret-value-at-least-32-chars" --self-test

  runtime:
    name: 运行时冒烟
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备 .env
        working-directory: baas
        run: |
          cp .env.example .env
          sed -i 's#^POSTGRES_PASSWORD=.*#POSTGRES_PASSWORD=ci-password-please-change#' .env
          sed -i 's#^JWT_SECRET=.*#JWT_SECRET=ci-only-secret-value-at-least-32-chars#' .env
          sed -i 's#^GOTRUE_MAILER_AUTOCONFIRM=.*#GOTRUE_MAILER_AUTOCONFIRM=true#' .env
          sed -i 's#^GOTRUE_SMTP_HOST=.*#GOTRUE_SMTP_HOST=#' .env
          node scripts/gen-jwt.mjs --write

      - name: 拉起栈
        working-directory: baas
        run: |
          docker compose up -d --wait || docker compose up -d
          sleep 20
          docker compose ps

      - name: 应用迁移
        working-directory: baas
        run: |
          for i in $(seq 1 20); do
            docker compose exec -T db pg_isready -U postgres && break || sleep 3
          done
          bash scripts/migrate.sh

      - name: 初始化 bucket
        working-directory: baas
        run: bash scripts/init-storage.sh

      - name: 健康探测
        working-directory: baas
        run: node scripts/healthcheck.mjs --url http://localhost:8000

      - name: 库内自检
        working-directory: baas
        run: |
          bash scripts/db-psql.sh -c "select * from public.baas_selfcheck();"
          bash scripts/db-psql.sh -c "select count(*) as rls_missing from public.rls_missing;"

      - name: 收集日志（失败时）
        if: failure()
        working-directory: baas
        run: docker compose logs --no-color --tail 200

      - name: 收尾
        if: always()
        working-directory: baas
        run: docker compose down -v
