name: Deploy

# 铁律八：任务完成后必须全自动化部署到远程生产环境（前后端 + 数据库）
# 触发：push 到 main，或手动 workflow_dispatch
# 流程：安装 → 类型检查 → 测试 → 前端构建（质量门禁）→ SSH 远程发布 → 线上健康检查

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: 质量门禁（类型检查 + 测试 + 前端构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 配置门禁：此前只在本地 npm run check 中执行，CI 未挂导致「本地拦得住、流水线拦不住」。
      # env-check 校验 .env.example 与 09 清单双向对齐且无真实密钥入库；version-check 落实铁律四。
      # 两者都只读仓库内文件，不依赖任何 Secret / 外部服务，故放在类型检查之前快速失败。
      - name: 密钥模板校验（09 清单 §0）
        run: node scripts/env-check.mjs

      - name: 版本号校验（铁律四）
        run: node scripts/version-check.mjs

      - name: 类型检查
        run: pnpm -r typecheck

      - name: 后端契约测试
        run: pnpm --filter @mim/api test

      - name: 前端构建
        run: pnpm --filter @mim/web build

      # 管理后台构建：与用户端同样是发布物，构建失败必须在 verify 阶段拦截，
      # 而不是等到服务器侧 deploy.sh 才失败（那时用户端已被覆盖、回滚成本更高）
      - name: 管理后台构建
        run: pnpm --filter @mim/admin build

      # 铁律十一：注释覆盖率硬门禁（--strict，总覆盖率低于阈值即退出 1 阻断发布）
      # 最近一次实测（2026-11-07）：总体覆盖率 93.7%、未达标文件 0、最低单文件 80.9%，
      # 均高于默认阈值（80%）；数值随代码变动，以每次 CI 实测输出为准，此注释仅为基线说明
      - name: 注释覆盖率门禁（铁律十一）
        run: node scripts/comment-check.mjs --strict

  deploy:
    name: 发布到生产服务器
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mim.mixm.top
    steps:
      - uses: actions/checkout@v4

      # 生产主机凭据守卫（铁律一 / 十二）。
      # 2026-11-10 修复：仓库当前未配置任何 secret，上一版直接执行 scp/ssh 导致
      # 「ssh: Could not resolve hostname : Name or service not known」（主机名取到空串），
      # main 连续 3 个提交的 Deploy 作业均失败，红信号与「代码真有 bug」无法区分。
      # 现在：凭据缺失 → 后续远程步骤全部 SKIP 并输出 ::warning::（明确「不等于已上线」）；
      # 凭据齐备 → 照原流程真实发布，失败依旧红。
      - name: 检查生产主机凭据
        id: creds
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "has_creds=0" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 配置 SSH
        if: steps.creds.outputs.has_creds == '1'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # 服务器到 github.com 的 HTTPS 被阻断，代码同步走 SSH deploy key（见 deploy/deploy.sh）。
      # 先把本次提交的部署脚本推到服务器，避免服务器上的旧脚本把部署跑死。
      - name: 上传本次提交的部署脚本
        if: steps.creds.outputs.has_creds == '1'
        run: |
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no \
            deploy/deploy.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/mim-deploy.sh"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo -n install -m 755 /tmp/mim-deploy.sh /opt/mim/app/deploy/deploy.sh"

      - name: 远程发布（检出本次提交 → 安装 → 构建 → 重启 → 健康检查）
        if: steps.creds.outputs.has_creds == '1'
        env:
          MIM_SMS_ALIYUN_ACCESS_KEY_ID: ${{ secrets.MIM_SMS_ALIYUN_ACCESS_KEY_ID }}
          MIM_SMS_ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.MIM_SMS_ALIYUN_ACCESS_KEY_SECRET }}
          MIM_SMS_ALIYUN_SIGN_NAME: ${{ secrets.MIM_SMS_ALIYUN_SIGN_NAME }}
          MIM_SMS_ALIYUN_TEMPLATE_CODE: ${{ secrets.MIM_SMS_ALIYUN_TEMPLATE_CODE }}
          MIM_EMAIL_SES_ACCESS_KEY_ID: ${{ secrets.MIM_EMAIL_SES_ACCESS_KEY_ID }}
          MIM_EMAIL_SES_SECRET_ACCESS_KEY: ${{ secrets.MIM_EMAIL_SES_SECRET_ACCESS_KEY }}
          MIM_EMAIL_SES_REGION: ${{ secrets.MIM_EMAIL_SES_REGION }}
          MIM_EMAIL_SES_FROM_ADDRESS: ${{ secrets.MIM_EMAIL_SES_FROM_ADDRESS }}
          # RBAC 超管引导令牌：缺失则 /api/v1/admin/* 与 catalog 管理写路由返回 403，
          # 独立后台 /admin/ 无法完成任何写操作（见 deploy/deploy.sh 的幂等写入段）。
          MIM_ADMIN_TOKEN: ${{ secrets.MIM_ADMIN_TOKEN }}
          # 管理员密码登录口令：未配置时 deploy.sh 现场生成随机值（不再使用仓库内可查的固定口令）；
          # 配置为 Secret 后可在多机/重装场景复用同一口令，值绝不落到公开日志。
          MIM_AUTH_ADMIN_PASSWORD: ${{ secrets.MIM_AUTH_ADMIN_PASSWORD }}
        run: |
          # 可选通道 secret 透传到远端 deploy.sh（%q 安全引用；未配置的 secret 为空则不传）
          ENV_ARGS=""
          for v in MIM_SMS_ALIYUN_ACCESS_KEY_ID MIM_SMS_ALIYUN_ACCESS_KEY_SECRET MIM_SMS_ALIYUN_SIGN_NAME MIM_SMS_ALIYUN_TEMPLATE_CODE \
                   MIM_EMAIL_SES_ACCESS_KEY_ID MIM_EMAIL_SES_SECRET_ACCESS_KEY MIM_EMAIL_SES_REGION MIM_EMAIL_SES_FROM_ADDRESS \
                   MIM_ADMIN_TOKEN MIM_AUTH_ADMIN_PASSWORD; do
            val="${!v}"
            [ -n "$val" ] && ENV_ARGS="$ENV_ARGS $(printf '%s=%q' "$v" "$val")"
          done
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo -n env $ENV_ARGS bash /opt/mim/app/deploy/deploy.sh $GITHUB_SHA"

      - name: 校验服务器代码版本与本次提交一致
        if: steps.creds.outputs.has_creds == '1'
        run: |
          remote=$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo -n git -C /opt/mim/app rev-parse HEAD")
          echo "server=$remote"
          echo "runner=$GITHUB_SHA"
          if [ "$remote" != "$GITHUB_SHA" ]; then
            echo "❌ 服务器代码版本与本次提交不一致"
            exit 1
          fi
          echo "✅ 服务器版本与本次提交一致"

      - name: 线上健康检查
        if: steps.creds.outputs.has_creds == '1'
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 https://mim.mixm.top/health; then
              echo "✅ 生产健康检查通过"
              exit 0
            fi
            sleep 5
          done
          echo "❌ 生产健康检查失败"
          exit 1

      # 独立管理后台路由断言：/admin（无斜杠）必须 301 到 /admin/，
      # /admin/ 必须返回后台自身 index.html（含 noindex 与 admin 产物引用）。
      # 若此步失败，说明服务器 nginx 未安装仓库内的站点配置（历史 BUG：
      # deploy.sh 只 reload 不 install，导致 /admin/* 被用户端 SPA 回退吞掉）。
      - name: 管理后台路由断言
        if: steps.creds.outputs.has_creds == '1'
        run: |
          set -e
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 https://mim.mixm.top/admin)
          if [ "$code" != "301" ]; then
            echo "❌ /admin 期望 301，实际 $code"
            exit 1
          fi
          echo "✅ /admin → 301"

          body=$(curl -fsS --max-time 5 https://mim.mixm.top/admin/)
          echo "$body" | grep -q 'noindex' || { echo "❌ /admin/ 缺少 noindex，疑似落回用户端页面"; exit 1; }
          echo "$body" | grep -q 'assets/index-' || { echo "❌ /admin/ 未引用管理后台产物"; exit 1; }
          echo "✅ /admin/ 返回管理后台页面"

      # 正向抽查一个仍在线且无需鉴权的接口：空体应返回 400（说明路由已挂载且校验生效）
      - name: 线上认证接口抽查
        if: steps.creds.outputs.has_creds == '1'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
            -X POST -H 'Content-Type: application/json' -d '{}' \
            https://mim.mixm.top/api/v1/auth/code)
          if [ "$code" != "400" ]; then
            echo "❌ /api/v1/auth/code 空体期望 400，实际 $code"
            exit 1
          fi
          echo "✅ /api/v1/auth/code 在线（$code）"

          # 非法 JSON 属客户端错误，必须归一为 400，不得回 500
          bad=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
            -X POST -H 'Content-Type: application/json' --data-binary '{"region":' \
            https://mim.mixm.top/api/v1/auth/code)
          if [ "$bad" != "400" ]; then
            echo "❌ /api/v1/auth/code 非法 JSON 期望 400，实际 $bad"
            exit 1
          fi
          echo "✅ /api/v1/auth/code 非法 JSON 返回 400（$bad）"

      # 凭据缺失时的显式提示：作业变绿只代表「本地门禁 + 其它平台」通过，
      # 生产并未部署，不得据此宣称已上线（铁律八 / 十二）。
      - name: 未配置凭据 SKIP 提示
        if: steps.creds.outputs.has_creds == '0'
        run: |
          echo "::warning::未配置 DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY，生产发布已 SKIP；这不等于「已上线」（铁律八），请补齐仓库 secrets 后重跑本作业。"

  # ---------- GitHub Pages：托管前端静态产物 ----------
  # Pages 无服务端，前端必须以 VITE_API_ORIGIN 直连生产 API；跨域由 MIM_CORS_ORIGINS 放行
  # https://afdk1991.github.io（deploy/deploy.sh 幂等补齐）。vite base='./' 使产物可挂 /mim/ 子路径。
  pages:
    name: GitHub Pages（前端静态站）
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端（注入生产 API 源）
        env:
          VITE_API_ORIGIN: https://mim.mixm.top
        run: pnpm --filter @mim/web build

      - uses: actions/configure-pages@v5
        with:
          # 仓库重建后 Pages 站点会随仓库一起消失，而 configure-pages 默认只读取已有站点、不负责开通，
          # 站点不存在时该步骤直接失败（2026-11-08 实测：Run actions/configure-pages@v5 -> failure）。
          # enablement=true 让该步骤在站点缺失时用 GITHUB_TOKEN（本作业已授予 pages: write）自动开通 Pages。
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------- GitHub Packages：ghcr 容器镜像（npm registry 受 scope==owner 限制，故走容器分发） ----------
  packages:
    name: GitHub Packages（ghcr 镜像）
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/afdk1991/mim-api:latest
            ghcr.io/afdk1991/mim-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 托管平台同步（无凭证则 SKIP，不阻断主链路） ----------
  platforms:
    name: 托管平台同步（Cloudflare Pages / Worker / Vercel / IGA / Netlify / Render / Gitee）
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 —— Gitee 镜像同步步骤需要完整历史才能把同一提交推过去。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 构建前端（同源，由各平台反代 /api）
        run: pnpm --filter @mim/web build

      # 各平台步骤相互隔离：单个平台失败（凭证过期 / 平台侧故障）不得阻断其余平台同步。
      # 失败仍会在该步骤标红并输出原因，便于定位。
      # Vercel：仓库是 pnpm monorepo，在根目录部署会被 Vercel 自动识别出多个 service
      # （mim-api / mim-web）并与根级构建属性冲突。因此改为「干净静态目录 + 根 vercel.json」部署：
      # 目录内只有 apps/web/dist 产物与反代/SPA 回退配置，Vercel 视为纯静态站点。
      - name: Vercel
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "SKIP: 缺少 VERCEL_TOKEN"; exit 0
          fi
          STATIC_DIR="$RUNNER_TEMP/vercel-static"
          rm -rf "$STATIC_DIR"
          mkdir -p "$STATIC_DIR"
          cp -r apps/web/dist/. "$STATIC_DIR"/
          cp vercel.json "$STATIC_DIR"/vercel.json
          # VERCEL_ORG_ID / VERCEL_PROJECT_ID 由 env 注入，CLI 会自动绑定到既有项目
          cd "$STATIC_DIR"
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1 | tail -n 20

      # Cloudflare Pages：唯一已配置真实凭据的分发平台，故不设 continue-on-error，
      # 部署失败必须让作业变红，避免「SKIP / 报错但仍 success」的假绿。
      - name: Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WRANGLER_CONFIG: ${{ secrets.CLOUDFLARE_WRANGLER_CONFIG }}
        run: |
          # 优先使用长期 API Token；未配置时回退到 wrangler OAuth 凭据（含 refresh_token 自动续期）
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_WRANGLER_CONFIG" ]; then
            mkdir -p ~/.config/.wrangler/config
            printf '%s\n' "$CLOUDFLARE_WRANGLER_CONFIG" > ~/.config/.wrangler/config/default.toml
            chmod 600 ~/.config/.wrangler/config/default.toml
            echo "使用 wrangler OAuth 凭据部署"
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_WRANGLER_CONFIG" ]; then
            echo "SKIP: 缺少 CLOUDFLARE_API_TOKEN / CLOUDFLARE_WRANGLER_CONFIG"; exit 0
          fi
          # 项目名统一为 mim（与项目名 Mim 对齐）；注意其域名是 mim-299.pages.dev ——
          # Pages 子域全局唯一，mim.pages.dev 已被他人占用，平台在建项时自动分配后缀。
          npx --yes wrangler@4 pages deploy apps/web/dist --project-name=mim --branch=main --commit-dirty=true

      # 独立 Worker（mim-store）：根路径曾长期 404（Worker 在边缘存活但无根路由）。
      # 源码入仓 workers/mim-store，由同一套 CLOUDFLARE_* 凭据部署，根路径改为透传生产站。
      - name: Cloudflare Worker（mim-store 固定入口）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "SKIP: 缺少 CLOUDFLARE_API_TOKEN"; exit 0
          fi
          npx --yes wrangler@4 deploy --config workers/mim-store/wrangler.toml

      # Cloudflare Worker（mim-api-edge）：替代原 Sealos 付费容器（应用已停服、余额 0，
      # 按日约 ¥0.52 计费，与「只走免费方案」冲突，用户 2026-11-12 决策走「换免费平台」）。
      # 新入口在 Cloudflare 免费 Worker 上把 /health 与 /api/v1/* 透传到生产权威终点，
       # 因此 API 仍有第二个真实可探测的免费入口，不再依赖付费容器。
      - name: Cloudflare Worker（mim-api-edge 免费 API 入口）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "SKIP: 缺少 CLOUDFLARE_API_TOKEN"; exit 0
          fi
          npx --yes wrangler@4 deploy --config workers/mim-api-edge/wrangler.toml

      - name: IGA Pages
        continue-on-error: true
        env:
          IGA_ACCESS_KEY: ${{ secrets.IGA_ACCESS_KEY }}
          IGA_SECRET_KEY: ${{ secrets.IGA_SECRET_KEY }}
          IGA_PROJECT_NAME: ${{ secrets.IGA_PROJECT_NAME }}
        run: bash deploy/iga/deploy.sh

      # Netlify：纯静态站点免费层（300 构建分钟/月）。缺凭证即 SKIP，不阻断主链路。
      - name: Netlify
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "SKIP: 缺少 NETLIFY_AUTH_TOKEN"; exit 0
          fi
          npx --yes netlify-cli@latest deploy --prod \
            --dir=apps/web/dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"

      # Render：免费静态站点（750 实例小时/月，空闲休眠）。触发已存在服务的部署，缺凭证即 SKIP。
      - name: Render
        continue-on-error: true
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "SKIP: 缺少 RENDER_API_KEY"; exit 0
          fi
          curl -fsS -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" -d '{}'

      # 线上取证（铁律八 / 铁律九）：在 Runner 侧逐平台验证全部对外域名真实可访问。
      # 本机网络对 *.vercel.app / *.workers.dev 存在 DNS 污染与 TLS 阻断，
      # 故以 CI 出口作为独立取证点；`000` 代表 TCP/TLS/DNS 层未到达，不等同于 4xx/5xx。
      - name: 线上取证（多平台域名可访问性）
        continue-on-error: true
        run: |
          set +e
          for url in \
            https://mim.mixm.top/health \
            https://mim.mixm.top/ \
            https://mim.mixm.top/api/v1/modules \
            https://mim-299.pages.dev/ \
            https://mim-puce.vercel.app/ \
            https://data.mixm.top/ \
            https://afdk1991.github.io/mim/ \
            https://mim-api-edge.15726833367.workers.dev/health \
            https://ghcr.io/v2/ \
            https://gitee.com/mallwm_admin/mim \
            https://github.com/afdk1991/mim \
            https://mim-store.15726833367.workers.dev/ \
            https://mim-45yeiirr.edgeone.cool/ \
            https://mim-04xa6mw3hm-e1uhm452pi.preview.iga-pages.com/ ; do
            out=$(curl -k -s -o /dev/null -w '%{http_code}|%{size_download}|%{time_total}|%{remote_ip}' --max-time 20 "$url")
            echo "$url => $out"
          done

      # Gitee 镜像同步（铁律十二）：把「本次触发的同一个提交」推到国内镜像仓。
      # 令牌取自仓库 secret GITEE_TOKEN（Gitee 私人令牌，需 projects 权限）；
      # 缺失时明确 SKIP 并输出 ::warning::，不得用「步骤成功」冒充「已同步」。
      # 竞态处理：Gitee 可能被并发推送推进到含本次提交的更新提交 → 这种「非快进」
      # 不代表镜像失效，判为已同步；只有真分叉（远端不含本提交）才报错，且不强推。
      - name: Gitee 镜像同步
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: ${{ secrets.GITEE_USER || 'mallwm_admin' }}
        run: |
          set -uo pipefail
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::warning::未配置 GITEE_TOKEN，跳过 Gitee 镜像同步（不代表已同步）"
            exit 0
          fi
          BRANCH="${GITHUB_REF_NAME}"
          SHA="$(git rev-parse --short HEAD)"
          URL="https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/mallwm_admin/mim.git"
          if git push "$URL" "HEAD:refs/heads/${BRANCH}"; then
            echo "Gitee 镜像已同步：${GITEE_USER}/mim @ ${BRANCH} ${SHA}"
            exit 0
          fi
          echo "推送被拒，检查远端是否已包含本次提交（并发推送场景）"
          if git fetch "$URL" "$BRANCH" && git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "Gitee 远端已包含 ${SHA}（远端已推进到 $(git rev-parse --short FETCH_HEAD)），镜像视为已同步"
            exit 0
          fi
          echo "::error::Gitee ${BRANCH} 已与本次提交分叉且不含 ${SHA}，需人工确认后处理（未强推）"
          exit 1
