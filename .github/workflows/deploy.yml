name: deploy

# 部署到自有服务器（宿主机直部署 + systemd + nginx，全程不使用 Docker）。
#
# 与 build.yml 的分工：
#   build.yml  ——  质量闸门 + 前端静态站点发布到 GitHub Pages（只读展示用）
#   deploy.yml ——  质量闸门 + SSH 登录宿主机，按 deploy/README.md 的「更新发版」流程上线
#
# 一次提交，多运行时分发（对齐《全栈全站部署架构手册》CI 层）。三个发布层全部为
# 显式开关，缺省全部跳过（skipped 不影响 run 结论），配好对应 Secrets 后把
# Variable 置 true 即激活：
#
# 1) 服务器发布层（主路线，systemd + nginx）
#    Variable: ENABLE_SERVER_DEPLOY = true
#    Secrets:  OCI_HOST（服务器地址）/ OCI_USER（部署账号，需 sudo）/ OCI_SSH_KEY（私钥整段 PEM）
#    Variable: MIM_DIR（可选，安装目录，默认 /opt/mim）
#
# 2) 边缘层（可选，Cloudflare Workers 地理选路 + D1 只读副本，见 worker/）
#    Variable: ENABLE_EDGE_DEPLOY = true
#    Secrets:  CLOUDFLARE_API_TOKEN（仅 Workers 编辑权限，限定 account）/ CLOUDFLARE_ACCOUNT_ID
#    前置:     wrangler d1 create mim-readonly && wrangler kv namespace create MIM_CACHE，
#              把 id 回填 worker/wrangler.jsonc，并 wrangler secret put SYNC_TOKEN / HEALTH_CHECK_SECRET
#
# 3) EdgeOne Makers（可选，亚太/国内就近入口。正常由 Makers 控制台连 Git 自动部署，
#    本 job 用于 CI 侧主动触发重新部署）
#    Variable: ENABLE_MAKERS_DEPLOY = true
#    Secrets:  EO_DEPLOY_HOOK_URL（推荐，Makers 项目的部署 Webhook）或 EO_TOKEN（CLI 方式）
#
# 注意：本仓库有意不提交 package-lock.json（见 .gitignore），
#      因此只能用 `npm install`，`npm ci` 必然失败。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_build:
        description: '跳过前端构建（只重启后端时用）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: 质量闸门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 不能用 cache: npm —— 仓库没有 lock 文件，setup-node 会直接报错
          node-version: '22'
      - name: 安装依赖
        # --legacy-peer-deps：npm/cli#7678，vitest 4 peer 冲突会触发 edgesOut 崩溃
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: 禁止容器化产物
        # 与 build.yml 同款闸门：本项目全程不使用 Docker
        run: |
          hit=$(git ls-files | grep -Ei '(^|/)(Dockerfile|docker-compose\.ya?ml|\.dockerignore)$' || true)
          if [ -n "$hit" ]; then
            echo "::error::本项目不使用容器：$hit"
            exit 1
          fi
      - name: 类型检查
        run: npm run typecheck
      - name: 单元与契约测试
        run: npm run test
      - name: 后端语法门禁
        run: npm --prefix server run check
      - name: 边缘层类型检查（worker/）
        # worker 目录同样不提交 lock 文件（wrangler/esbuild 跨平台可选依赖，npm/cli#4828）
        run: |
          npm --prefix worker install --no-audit --no-fund --legacy-peer-deps
          npm --prefix worker run typecheck

  deploy:
    name: 发布到服务器
    needs: gate
    # 服务器发布层为显式开关的可选层：未配置变量时整体跳过（skipped 不影响 run 结论），
    # 避免「还没买服务器」阶段每次 push 都红。配好 Secrets 后设 ENABLE_SERVER_DEPLOY=true 即激活。
    if: github.ref == 'refs/heads/main' && vars.ENABLE_SERVER_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: 校验部署密钥
        run: |
          missing=""
          [ -n "${{ secrets.OCI_HOST }}" ]    || missing="$missing OCI_HOST"
          [ -n "${{ secrets.OCI_USER }}" ]    || missing="$missing OCI_USER"
          [ -n "${{ secrets.OCI_SSH_KEY }}" ] || missing="$missing OCI_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::缺少 Secrets:$missing"
            exit 1
          fi

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # 首次连接写入 known_hosts；正式环境建议改成预置指纹，避免 TOFU 信任
          ssh-keyscan -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 拉取代码并重启服务
        env:
          MIM_DIR: ${{ vars.MIM_DIR || '/opt/mim' }}
          SKIP_BUILD: ${{ github.event.inputs.skip_build == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}" \
            "MIM_DIR='$MIM_DIR' SKIP_BUILD='$SKIP_BUILD' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$MIM_DIR"

          echo '--> git pull（只允许快进，避免服务器上有本地改动被覆盖）'
          git pull --ff-only

          echo '--> 前端与后端依赖'
          npm install --no-audit --no-fund --legacy-peer-deps
          npm --prefix server install --omit=dev --no-audit --no-fund --legacy-peer-deps

          if [ "${SKIP_BUILD:-0}" = '1' ]; then
            echo '--> SKIP_BUILD=1，跳过前端构建'
          else
            echo '--> 构建前端'
            npm run build
          fi

          echo '--> 数据库迁移（幂等）'
          cd "$MIM_DIR/server"
          npm run migrate

          echo '--> 重启后端'
          sudo systemctl restart mim-server
          REMOTE

      - name: 健康检查
        env:
          MIM_DIR: ${{ vars.MIM_DIR || '/opt/mim' }}
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            # 端口从远端 $MIM_DIR/server/.env 读取（读不到回退 8787），
            # 避免服务器改了 PORT 后 CI 仍打 8787 误报部署失败
            if ssh -i ~/.ssh/id_deploy -o BatchMode=yes "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}" \
               "set -euo pipefail; P=\$(grep -E '^PORT=' '$MIM_DIR/server/.env' | cut -d= -f2-); P=\${P:-8787}; curl -fsS http://127.0.0.1:\$P/api/health"; then
              echo
              echo '健康检查通过'
              exit 0
            fi
            sleep 2
          done
          echo '::error::健康检查连续失败，下面是后端最近日志'
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}" \
            'sudo journalctl -u mim-server -n 50 --no-pager' || true
          exit 1

  edge:
    name: 发布到 Cloudflare 边缘层（可选）
    needs: gate
    # 可选层：worker/ 边缘网关（地理选路 + D1 只读副本），默认关闭。
    # 配好 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 后设 ENABLE_EDGE_DEPLOY=true 激活。
    if: github.ref == 'refs/heads/main' && vars.ENABLE_EDGE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 校验边缘层密钥
        run: |
          missing=""
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]  || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::缺少 Secrets:$missing"
            exit 1
          fi
      - name: 安装依赖并类型检查
        run: |
          npm --prefix worker install --no-audit --no-fund --legacy-peer-deps
          npm --prefix worker run typecheck
      - name: wrangler deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'worker'
          command: deploy

  makers:
    name: 触发 EdgeOne Makers 部署（可选）
    needs: gate
    # 可选层：Makers 正常由控制台连 Git 自动构建部署；本 job 用于 CI 侧主动触发重新部署。
    # 默认关闭，配好 EO_DEPLOY_HOOK_URL 或 EO_TOKEN 后设 ENABLE_MAKERS_DEPLOY=true 激活。
    if: github.ref == 'refs/heads/main' && vars.ENABLE_MAKERS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 触发部署
        env:
          EO_DEPLOY_HOOK_URL: ${{ secrets.EO_DEPLOY_HOOK_URL }}
          EO_TOKEN: ${{ secrets.EO_TOKEN || secrets.EDGEONE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${EO_DEPLOY_HOOK_URL:-}" ]; then
            echo '--> 通过部署 Webhook 触发 Makers 重新部署'
            curl -fsSL -X POST "$EO_DEPLOY_HOOK_URL"
          elif [ -n "${EO_TOKEN:-}" ]; then
            echo '--> 通过 edgeone CLI 部署前端构建产物（要求项目为「直接上传」型）'
            npm install --no-audit --no-fund --legacy-peer-deps
            npm run build
            npx --yes edgeone login -t "$EO_TOKEN" --local
            npx --yes edgeone makers deploy ./dist
          else
            echo '::error::缺少 Secrets：EO_DEPLOY_HOOK_URL（推荐）或 EO_TOKEN'
            exit 1
          fi
