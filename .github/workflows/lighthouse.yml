name: Lighthouse CI

# push main / 手动触发：对线上 GitHub Pages 站点跑 Lighthouse 评分，
# 四项得分写入 Job Summary（直接评测线上产物，无需本地构建）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Lighthouse 评分（线上 Pages）
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://afdk1991.github.io/mim/
          uploadArtifacts: true

      - name: 写入评分摘要
        if: always()
        run: |
          echo "## 🏆 Lighthouse 评分 · https://afdk1991.github.io/mim/" >> "$GITHUB_STEP_SUMMARY"
          node -e "
          const fs = require('fs');
          const dir = process.argv[1];
          if (!dir || !fs.existsSync(dir)) { fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '_无结果（检查 lighthouse 步骤日志）_'); process.exit(0); }
          const files = fs.readdirSync(dir).filter((f) => f.endsWith('.json'));
          let wrote = false;
          for (const f of files) {
            const r = JSON.parse(fs.readFileSync(dir + '/' + f, 'utf8'));
            if (!r.categories) continue;
            const s = (k) => Math.round((r.categories[k]?.score ?? 0) * 100);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '| 指标 | 得分 |\n| --- | --- |\n' +
              '| Performance | ' + s('performance') + ' |\n' +
              '| Accessibility | ' + s('accessibility') + ' |\n' +
              '| Best Practices | ' + s('best-practices') + ' |\n' +
              '| SEO | ' + s('seo') + ' |\n');
            wrote = true;
          }
          if (!wrote) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '_未解析到评分 JSON_');
          " "${{ steps.lhci.outputs.resultsPath }}"
