name: build

# 重建后的新流水线：只做「质量闸门 + 静态站点部署」。
# 旧 ci-cd.yml 里的 migrate-db / 云函数 / Edge Function 三个作业依赖
# Supabase 与 CloudBase 凭证，后端收敛到自托管 server 后已无意义，不再保留。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 20 自带的 npm 10.8.2 在无 lock 文件构建依赖树时会抛
          # `Cannot read properties of null (reading 'edgesOut')`（npm/cli 已知缺陷）。
          # Node 22 的 npm 10.9.x 在出现 peer 冲突（如 vitest 4）时同样会复现该缺陷，
          # 必须配合 --legacy-peer-deps 规避（与 build-release.yml 同一修复方案）。
          node-version: '22'
          # 不能开 cache: npm —— 本仓库有意不入库 package-lock.json
          # （npm/cli#4828 会按当前平台裁剪可选依赖，跨平台复用会缺 rollup 原生二进制），
          # setup-node 的 cache 找不到 lock 文件会直接报错让作业变红。
      - name: 安装依赖
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: 禁止容器化产物
        # 本项目全程不使用 Docker（部署方式是宿主机直部署 + systemd，见 deploy/README.md）。
        # 这道闸门把约定变成机器可校验的约束，防止将来有人顺手把 Dockerfile 或 compose 加回来。
        run: |
          hit=$(git ls-files | grep -Ei '(^|/)(Dockerfile|docker-compose\.ya?ml|\.dockerignore)$' || true)
          if [ -n "$hit" ]; then
            echo "::error::本项目不使用容器：$hit"
            exit 1
          fi
      - name: 类型检查
        run: npm run typecheck
      - name: 构建
        env:
          # 后端地址在构建期注入；未配置时前端回退同源 /api
          VITE_MIM_API_BASE: ${{ vars.MIM_API_BASE }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy-pages:
    name: 部署到 GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
