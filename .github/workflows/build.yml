name: build

# 重建后的新流水线：只做「质量闸门 + 静态站点部署」。
# 旧 ci-cd.yml 里的 migrate-db / 云函数 / Edge Function 三个作业依赖
# Supabase 与 CloudBase 凭证，后端收敛到自托管 server 后已无意义，不再保留。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 20 自带的 npm 10.8.2 在无 lock 文件构建依赖树时会抛
          # `Cannot read properties of null (reading 'edgesOut')`（npm/cli 已知缺陷）。
          # Node 22 的 npm 10.9.x 在出现 peer 冲突（如 vitest 4）时同样会复现该缺陷，
          # 必须配合 --legacy-peer-deps 规避（与 build-release.yml 同一修复方案）。
          node-version: '22'
          # 不能开 cache: npm —— 本仓库有意不入库 package-lock.json
          # （npm/cli#4828 会按当前平台裁剪可选依赖，跨平台复用会缺 rollup 原生二进制），
          # setup-node 的 cache 找不到 lock 文件会直接报错让作业变红。
      - name: 安装依赖
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: 禁止容器化产物
        # 本项目全程不使用 Docker（部署方式是宿主机直部署 + systemd，见 deploy/README.md）。
        # 这道闸门把约定变成机器可校验的约束，防止将来有人顺手把 Dockerfile 或 compose 加回来。
        # 加固：在原有单层扩展名检查之外，额外拦截双扩展名残留（*.yml.yml / *.sh.sh / *.ts.ts /
        # *.yaml.yaml / *.json.json），并以文件内容关键字（docker-compose / FROM / image:）做兜底扫描。
        run: |
          # 仅当处于 git 工作树内才扫描仓库文件；非 git 仓库（罕见）跳过本闸门，避免命令失败。
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "::notice::非 git 仓库，跳过禁容器闸门"
            exit 0
          fi

          hits=""

          # 1) 单层扩展名：Dockerfile / docker-compose.y(a)ml / .dockerignore
          h1=$(git ls-files | grep -Ei '(^|/)(Dockerfile|docker-compose\.ya?ml|\.dockerignore)$' || true)
          [ -n "$h1" ] && hits="$hits$h1"$'\n'

          # 2) 双扩展名残留：*.yml.yml / *.sh.sh / *.ts.ts / *.yaml.yaml / *.json.json
          h2=$(git ls-files | grep -Ei '\.(ya?ml|sh|ts|json)\.(ya?ml|sh|ts|json)$' || true)
          [ -n "$h2" ] && hits="$hits$h2"$'\n'

          # 3) 内容关键字兜底：docker-compose / FROM (Dockerfile 标记) / image: (compose 镜像字段)。
          #    仅扫描可能成为容器产物的 YAML / Dockerfile / .dockerignore，并排除 .github/ 工作流
          #    （其注释/字符串常含 image:、docker-compose，属正常 CI 配置，并非容器产物）。
          h3=$(git ls-files \
                 | grep -Ei '\.ya?ml$|/Dockerfile$|\.dockerfile$|\.dockerignore$' \
                 | grep -v '^\.github/' \
                 | xargs -I{} grep -IliE 'docker-compose|^FROM |image:' {} 2>/dev/null \
                 || true)
          [ -n "$h3" ] && hits="$hits$h3"$'\n'

          if [ -n "$hits" ]; then
            echo "::error::本项目不使用容器，命中以下文件/内容："
            printf '%s\n' "$hits"
            exit 1
          fi
      - name: 类型检查
        run: npm run typecheck
      - name: 构建
        env:
          # 后端地址在构建期注入；未配置时前端回退同源 /api
          VITE_MIM_API_BASE: ${{ vars.MIM_API_BASE }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy-pages:
    name: 部署到 GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
