name: CI/CD · 构建 & 部署

# 边开发边上线：
# - push main / 手动触发 → 构建 → 同步部署到 GitHub Pages + EdgeOne Makers
# - 打 tag v* → 构建 + 发布 npm 包到 GitHub Packages（Pages/Makers 与 main 同提交，无需重复部署）
# - pull_request → 只跑质量门禁（typecheck + build），不部署

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 质量门禁 & 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm install（非 npm ci，lock 不入库）：规避 npm/cli#4828 —— 按运行平台全新解析可选依赖
      # 先升级 npm 到 10.9.9+：npm/cli#7678 arborist "Cannot read properties of null (reading 'edgesOut')"
      # 崩溃由 vite 8 optional peers 触发，node 20 自带的旧版 npm 未修复；--legacy-peer-deps 双保险
      - name: 安装依赖
        run: |
          npm install -g npm@10.9.9
          npm install --no-fund --no-audit --legacy-peer-deps

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test

      - name: 构建
        run: npm run build
        env:
          # Supabase 云凭证（未配置时 supabase client 为 null，回退纯本地）
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy-pages:
    name: 部署 GitHub Pages
    needs: build
    # github-pages 环境默认仅允许默认分支部署（tag/PR 会被环境策略拒绝）；tag 与 main 同提交，无需重复部署
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-edgeone:
    name: 部署 EdgeOne Makers
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # EdgeOne Makers 项目名（已存在 makers-euoglvyjyknd），可在仓库变量或此处修改
      EDGEONE_PROJECT_NAME: mim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 升级 npm 规避 arborist edgesOut 崩溃（vite 8 optional peers，同 build job）
      - name: 安装依赖
        run: |
          npm install -g npm@10.9.9
          npm install --no-fund --no-audit --legacy-peer-deps

      - name: 安装 EdgeOne CLI
        run: npm install -g edgeone

      # Makers 部署：CLI 自动检测框架、构建并上传 dist；-t 复用 EdgeOne API Token
      - name: 部署至 EdgeOne Makers（production）
        run: PAGES_SOURCE=skills edgeone makers deploy -n "$EDGEONE_PROJECT_NAME" -t "${{ secrets.EDGEONE_API_TOKEN }}" --json

  publish-package:
    name: 发布 npm 包到 GitHub Packages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: 准备发布配置
        run: node scripts/prepare-package.mjs "${{ github.repository_owner }}"

      # 先升级 npm（npm/cli#7678 arborist edgesOut 崩溃，同 build job）
      - name: 安装依赖
        run: |
          npm install -g npm@10.9.9
          npm install --no-fund --no-audit --legacy-peer-deps

      - name: 构建
        run: npm run build
        env:
          # Supabase 云凭证（未配置时 supabase client 为 null，回退纯本地）
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 发布
        # 作用域包（@afdk1991/mim）默认按 private 发布，GitHub Packages 免费套餐仅允许 public → 必须 --access public
        # 凭据：优先用 PAT（secrets.NPM_TOKEN，需 write:packages + read:packages 作用域）；
        #       未配置时回退 GITHUB_TOKEN。若两者都报 403 write_package，说明账号级 GitHub Packages
        #       未开通/未接受条款，需在 github.com/settings/packages 开通后再跑。
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
