name: CI/CD · 构建 & 部署

# 边开发边上线：
# - push main / 手动触发 → 构建 → 同步部署到 GitHub Pages + EdgeOne Makers
# - cloudfunctions/ 有变更 + 已配 CloudBase 密钥 → 额外部署云函数 mim-api
# - 打 tag v* → 构建 + 发布 npm 包到 GitHub Packages（需配 NPM_TOKEN，见 publish-package 内注释；
#   Pages/Makers 与 main 同提交，无需重复部署）
# - pull_request → 只跑质量门禁（typecheck + build），不部署
#
# 云函数部署需先在仓库 Settings → Secrets 配三项（未配则整 job 跳过，不影响其他部署）：
#   CLOUDBASE_SECRET_ID / CLOUDBASE_SECRET_KEY（腾讯云 API 密钥）
#   CLOUDBASE_ENV_ID（CloudBase 环境 ID）

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # 必须为 false：本 workflow 含真实部署步骤。
  # 设为 true 时，连续 push 会让新 run 掐断正在进行的旧 run——
  # 实测 EdgeOne 已输出 "Deploy Success" 后仍被 cancel，job 报
  # "The operation was canceled" 假失败，且部署状态难以判断。
  # false = 排队依次跑完，牺牲少量 runner 分钟换取部署完整性与结果可信。
  cancel-in-progress: false

jobs:
  build:
    name: 质量门禁 & 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm install（非 npm ci，lock 不入库）：规避 npm/cli#4828 —— 按运行平台全新解析可选依赖
      # 先升级 npm 到 10.9.9+：npm/cli#7678 arborist "Cannot read properties of null (reading 'edgesOut')"
      # 崩溃由 vite 8 optional peers 触发，node 20 自带的旧版 npm 未修复；--legacy-peer-deps 双保险
      - name: 安装依赖
        run: |
          npm install -g npm@10.9.9
          npm install --no-fund --no-audit --legacy-peer-deps

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test

      - name: 构建
        run: npm run build
        env:
          # Mim 云端后端地址（CloudBase 云函数 mim-api 的 HTTP 入口，自带 CORS *）。
          # 直接内联而非走 secrets —— 根治「仓库未配 secret → 构建产物缺配置
          # → 永远回退本地演示模式」。
          VITE_MIM_API_BASE: https://cs-1-d5g815slocb5a611a-1320483685.ap-shanghai.app.tcloudbase.com/mim-api

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy-pages:
    name: 部署 GitHub Pages
    needs: build
    # github-pages 环境默认仅允许默认分支部署（tag/PR 会被环境策略拒绝）；tag 与 main 同提交，无需重复部署
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-edgeone:
    name: 部署 EdgeOne Makers
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # EdgeOne Makers 项目名（已存在 makers-euoglvyjyknd），可在仓库变量或此处修改
      EDGEONE_PROJECT_NAME: mim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 升级 npm 规避 arborist edgesOut 崩溃（vite 8 optional peers，同 build job）
      - name: 安装依赖
        run: |
          npm install -g npm@10.9.9
          npm install --no-fund --no-audit --legacy-peer-deps

      - name: 安装 EdgeOne CLI
        run: npm install -g edgeone

      # Makers 部署：CLI 自动检测框架、构建并上传 dist；-t 复用 EdgeOne API Token
      - name: 部署至 EdgeOne Makers（production）
        run: PAGES_SOURCE=skills edgeone makers deploy -n "$EDGEONE_PROJECT_NAME" -t "${{ secrets.EDGEONE_API_TOKEN }}" --json

  deploy-function:
    name: 部署云函数 mim-api
    needs: build
    # 仅 main 分支。
    # ⚠️ 不能写成 `if: ... && secrets.CLOUDBASE_SECRET_ID != ''` ——
    #    secrets 上下文在 job 级 if 中不合法，会导致整个 workflow 解析失败
    #    （实测：0 个 job 启动，Pages/EdgeOne 部署全部被阻塞）。
    #    正确做法：job 级 env 承接布尔值，再用 step 级 if 判断。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDBASE: ${{ secrets.CLOUDBASE_SECRET_ID != '' && secrets.CLOUDBASE_SECRET_KEY != '' && secrets.CLOUDBASE_ENV_ID != '' }}
    steps:
      - name: 未配置 CloudBase 密钥时跳过
        if: env.HAS_CLOUDBASE != 'true'
        run: echo "未配置 CLOUDBASE_SECRET_ID/KEY/ENV_ID，跳过云函数部署（不影响其他部署）"
      - uses: actions/checkout@v4
        if: env.HAS_CLOUDBASE == 'true'
        with:
          # 需要与上一个 commit 比对才能判断 cloudfunctions/ 是否变更
          fetch-depth: 0

      - name: 判断 cloudfunctions 是否变更
        id: changed
        if: env.HAS_CLOUDBASE == 'true'
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" -- cloudfunctions/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: env.HAS_CLOUDBASE == 'true' && steps.changed.outputs.changed == 'true'
        with:
          node-version: 22

      - name: 安装 CloudBase CLI 并部署
        if: env.HAS_CLOUDBASE == 'true' && steps.changed.outputs.changed == 'true'
        env:
          CLOUDBASE_SECRET_ID: ${{ secrets.CLOUDBASE_SECRET_ID }}
          CLOUDBASE_SECRET_KEY: ${{ secrets.CLOUDBASE_SECRET_KEY }}
          CLOUDBASE_ENV_ID: ${{ secrets.CLOUDBASE_ENV_ID }}
        run: |
          npm install -g @cloudbase/cli
          tcb login --apiKeyId "$CLOUDBASE_SECRET_ID" --apiKey "$CLOUDBASE_SECRET_KEY"
          tcb fn deploy mim-api -e "$CLOUDBASE_ENV_ID" --force

      - name: 未变更时跳过
        if: steps.changed.outputs.changed != 'true'
        run: echo "cloudfunctions/ 本轮无变更，跳过云函数部署"

  publish-package:
    name: 发布 npm 包到 GitHub Packages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: 准备发布配置
        run: node scripts/prepare-package.mjs "${{ github.repository_owner }}"

      # 先升级 npm（npm/cli#7678 arborist edgesOut 崩溃，同 build job）
      - name: 安装依赖
        run: |
          npm install -g npm@10.9.9
          npm install --no-fund --no-audit --legacy-peer-deps

      - name: 构建
        run: npm run build
        env:
          # Mim 云端后端地址（CloudBase 云函数 mim-api 的 HTTP 入口，自带 CORS *）。
          # 直接内联而非走 secrets —— 根治「仓库未配 secret → 构建产物缺配置
          # → 永远回退本地演示模式」。
          VITE_MIM_API_BASE: https://cs-1-d5g815slocb5a611a-1320483685.ap-shanghai.app.tcloudbase.com/mim-api

      - name: 发布
        # 作用域包（@afdk1991/mim）默认按 private 发布，GitHub Packages 免费套餐仅允许 public → 必须 --access public
        # 凭据：必须用 PAT（secrets.NPM_TOKEN，需 write:packages + read:packages 作用域）。
        # ⚠️ 不要指望 GITHUB_TOKEN 兜底 —— 实测即使包已关联仓库，
        #    GITHUB_TOKEN 仍报 403 permission_denied: write_package（v0.0.4 复现两次）。
        #    用户级公开 npm 包只能用 PAT 发布。
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
