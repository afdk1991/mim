name: CI/CD · 构建 & 部署

# 边开发边上线：
# - push main / 打 tag v* / 手动触发 → 构建 → 同步部署到 GitHub Pages + EdgeOne Pages
# - 打 tag v* → 额外发布 npm 包到 GitHub Packages
# - pull_request → 只跑质量门禁（typecheck + build），不部署

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 质量门禁 & 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy-pages:
    name: 部署 GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-edgeone:
    name: 部署 EdgeOne Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # EdgeOne Pages 项目名（项目不存在会自动创建），可在仓库变量或此处修改
      EDGEONE_PROJECT_NAME: mim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 EdgeOne CLI
        run: npm install -g edgeone

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 推送至 EdgeOne Pages（production）
        run: edgeone pages deploy ./dist -n "$EDGEONE_PROJECT_NAME" -t "${{ secrets.EDGEONE_API_TOKEN }}" -e production

  publish-package:
    name: 发布 npm 包到 GitHub Packages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: 准备发布配置
        run: node scripts/prepare-package.mjs "${{ github.repository_owner }}"

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 发布
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
