name: CI/CD · 构建 & 部署

# 边开发边上线：
# - push main / 手动触发 → 构建 → 同步部署到 GitHub Pages + EdgeOne Makers
# - cloudfunctions/ 有变更 + 已配 CloudBase 密钥 → 额外部署云函数 mim-api
# - supabase/functions/ 有变更 + 已配 Supabase 密钥 → 额外部署 Edge Function mim-api
# - 打 tag v* → 构建 + 发布 npm 包到 GitHub Packages（需配 NPM_TOKEN，见 publish-package 内注释；
#   Pages/Makers 与 main 同提交，无需重复部署）
# - pull_request → 只跑质量门禁（typecheck + build），不部署
#
# 云函数部署需先在仓库 Settings → Secrets 配三项（未配则整 job 跳过，不影响其他部署）：
#   CLOUDBASE_SECRET_ID / CLOUDBASE_SECRET_KEY（腾讯云 API 密钥）
#   CLOUDBASE_ENV_ID（CloudBase 环境 ID）
# Edge Function 部署需配四项（未配则整 job 跳过）：
#   SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF / SUPABASE_SERVICE_ROLE_KEY / MIM_TOKEN_SECRET
#
# 全链路「线上化」说明（本机只需 git push，其余全部由本 workflow 在云端完成）：
#   - 构建      → build job（typecheck + vite build）
#   - 数据库迁移 → migrate-db job（走 Supabase Management API，无需数据库密码，幂等）
#                 需配 secrets：SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF
#                 （可选 ADMIN_EMAIL：自动为指定注册邮箱授予 admin 角色）
#                 未配则整段跳过并提示，不阻塞部署
#   - 站点部署  → deploy-pages（GitHub Pages）+ deploy-edgeone（EdgeOne Makers）
#   - 线上验证  → verify-deploy job（对 Pages/Makers 做真实 HTTP 冒烟：
#                 index 200+挂载点、入口 bundle 完整可达、/admin 兜底重定向、Makers 域名存活）
#   - 包发布    → publish-package（GitHub Packages 的 NPM 包，仅 push tag 时）
#   故：本机不再需要执行 npm run build / db:apply / 部署 / 验证等任何命令。
#
# 前端后端优先级（src/lib/supabase.ts）：Supabase（直连，主）→ CloudBase mim-api（备）→ 本地演示。
# 两个云端入口均为公开值（publishable key 的安全由 RLS 保证），故与 VITE_MIM_API_BASE
# 一样直接内联注入，杜绝「仓库未配 secret → 构建产物缺配置 → 回退本地演示模式」。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # 必须为 false：本 workflow 含真实部署步骤。
  # 设为 true 时，连续 push 会让新 run 掐断正在进行的旧 run——
  # 实测 EdgeOne 已输出 "Deploy Success" 后仍被 cancel，job 报
  # "The operation was canceled" 假失败，且部署状态难以判断。
  # false = 排队依次跑完，牺牲少量 runner 分钟换取部署完整性与结果可信。
  cancel-in-progress: false

jobs:
  build:
    name: 质量门禁 & 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm install（非 npm ci，lock 不入库）：规避 npm/cli#4828 —— 按运行平台全新解析可选依赖
      # 先升级 npm 到 10.9.9+：npm/cli#7678 arborist "Cannot read properties of null (reading 'edgesOut')"
      # 崩溃由 vite 8 optional peers 触发，node 20 自带的旧版 npm 未修复；--legacy-peer-deps 双保险
      - name: 安装依赖
        run: |
          npm install -g npm@10.9.9
          npm install --no-fund --no-audit --legacy-peer-deps

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build
        env:
          # Mim 云端后端地址（CloudBase 云函数 mim-api 的 HTTP 入口，自带 CORS *）。
          # 直接内联而非走 secrets —— 根治「仓库未配 secret → 构建产物缺配置
          # → 永远回退本地演示模式」。
          VITE_MIM_API_BASE: https://cs-1-d5g815slocb5a611a-1320483685.ap-shanghai.app.tcloudbase.com/mim-api
          # Supabase（主后端）公开配置：URL + publishable key。
          # publishable key 按设计可暴露于客户端（数据安全由 RLS 全表策略保证），
          # 与 CloudBase 入口同理内联；EdgeOne Makers 构建读不到仓库变量，
          # 缺此内联会导致线上产物回退本地演示模式（源码内亦有同值兜底常量）。
          VITE_SUPABASE_URL: https://sepfobukokrrivwyvhnd.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_TV4e4DtFiufiJiY05WSFsQ_2FmlMCUg

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy-pages:
    name: 部署 GitHub Pages
    needs: build
    # github-pages 环境默认仅允许默认分支部署（tag/PR 会被环境策略拒绝）；tag 与 main 同提交，无需重复部署
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4

  migrate-db:
    name: 应用数据库迁移（Supabase 云端）
    needs: build
    # 仅 main 分支。走 Management API，无需数据库密码 —— 目的是让「应用迁移」这件事
    # 从本机搬到云端：配好 secret 后每次 push main 自动幂等应用，本机无需再跑 db:apply。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 云端通道零依赖（用内置 fetch 调 Management API），故无需 npm install
      - name: 按序应用 supabase/migrations/*.sql
        run: node scripts/apply-migration-remote.mjs

  deploy-edgeone:
    name: 部署 EdgeOne Makers
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # EdgeOne Makers 项目名（已存在 makers-euoglvyjyknd），可在仓库变量或此处修改
      EDGEONE_PROJECT_NAME: mim
    outputs:
      url: ${{ steps.eo.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 升级 npm 规避 arborist edgesOut 崩溃（vite 8 optional peers，同 build job）
      - name: 安装依赖
        run: |
          npm install -g npm@10.9.9
          npm install --no-fund --no-audit --legacy-peer-deps

      - name: 安装 EdgeOne CLI
        run: npm install -g edgeone

      # Makers 部署：CLI 自动检测框架、构建并上传 dist；-t 复用 EdgeOne API Token
      - name: 部署至 EdgeOne Makers（production）
        id: eo
        run: |
          set -o pipefail
          OUT=$(PAGES_SOURCE=skills edgeone makers deploy -n "$EDGEONE_PROJECT_NAME" -t "${{ secrets.EDGEONE_API_TOKEN }}" --json 2>&1)
          echo "$OUT"
          # 提取部署 URL（形如 https://mim-xxxxxxxx.edgeone.cool?eo_token=…）
          URL=$(printf '%s' "$OUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.edgeone\.[a-z]+[^"]*' | head -1)
          if [ -n "$URL" ]; then
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "::notice::EdgeOne Makers 部署地址：$URL"
          else
            echo "::warning::未能从部署输出中解析出 EdgeOne Makers 部署 URL"
          fi

  deploy-function:
    name: 部署云函数 mim-api
    needs: build
    # 仅 main 分支。
    # ⚠️ 不能写成 `if: ... && secrets.CLOUDBASE_SECRET_ID != ''` ——
    #    secrets 上下文在 job 级 if 中不合法，会导致整个 workflow 解析失败
    #    （实测：0 个 job 启动，Pages/EdgeOne 部署全部被阻塞）。
    #    正确做法：job 级 env 承接布尔值，再用 step 级 if 判断。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDBASE: ${{ secrets.CLOUDBASE_SECRET_ID != '' && secrets.CLOUDBASE_SECRET_KEY != '' && secrets.CLOUDBASE_ENV_ID != '' }}
    steps:
      - name: 未配置 CloudBase 密钥时跳过
        if: env.HAS_CLOUDBASE != 'true'
        run: echo "未配置 CLOUDBASE_SECRET_ID/KEY/ENV_ID，跳过云函数部署（不影响其他部署）"
      - uses: actions/checkout@v4
        if: env.HAS_CLOUDBASE == 'true'
        with:
          # 需要与上一个 commit 比对才能判断 cloudfunctions/ 是否变更
          fetch-depth: 0

      - name: 判断 cloudfunctions 是否变更
        id: changed
        if: env.HAS_CLOUDBASE == 'true'
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" -- cloudfunctions/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: env.HAS_CLOUDBASE == 'true' && steps.changed.outputs.changed == 'true'
        with:
          node-version: 22

      - name: 安装 CloudBase CLI 并部署
        if: env.HAS_CLOUDBASE == 'true' && steps.changed.outputs.changed == 'true'
        env:
          CLOUDBASE_SECRET_ID: ${{ secrets.CLOUDBASE_SECRET_ID }}
          CLOUDBASE_SECRET_KEY: ${{ secrets.CLOUDBASE_SECRET_KEY }}
          CLOUDBASE_ENV_ID: ${{ secrets.CLOUDBASE_ENV_ID }}
        run: |
          npm install -g @cloudbase/cli
          tcb login --apiKeyId "$CLOUDBASE_SECRET_ID" --apiKey "$CLOUDBASE_SECRET_KEY"
          tcb fn deploy mim-api -e "$CLOUDBASE_ENV_ID" --force

      - name: 未变更时跳过
        if: steps.changed.outputs.changed != 'true'
        run: echo "cloudfunctions/ 本轮无变更，跳过云函数部署"

  deploy-supabase-function:
    name: 部署 Supabase Edge Function mim-api
    needs: build
    # 仅 main 分支。
    # ⚠️ 同 deploy-function：secrets 不可用于 job 级 if（ workflow 解析失败、
    #    0 job 启动的坑见 DEPLOY.md 坑 ①），必须 job 级 env + step 级 if。
    # 未配密钥时整段跳过：前端主路径是浏览器直连 Supabase（anon key + RLS），
    # 本函数只是「同契约后端 API」备选，缺它不影响任何现有部署。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_SUPABASE: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' && secrets.MIM_TOKEN_SECRET != '' }}
    steps:
      - name: 未配置 Supabase 密钥时跳过
        if: env.HAS_SUPABASE != 'true'
        run: echo "未配置 SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF / SUPABASE_SERVICE_ROLE_KEY / MIM_TOKEN_SECRET，跳过 Edge Function 部署（不影响前端直连 Supabase 与其他部署）"

      - uses: actions/checkout@v4
        if: env.HAS_SUPABASE == 'true'
        with:
          # 需要与上一个 commit 比对才能判断 supabase/functions/ 是否变更
          fetch-depth: 0

      - name: 判断 supabase/functions 是否变更
        id: changed
        if: env.HAS_SUPABASE == 'true'
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" -- supabase/functions/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: env.HAS_SUPABASE == 'true' && steps.changed.outputs.changed == 'true'
        with:
          node-version: 22

      - name: 部署 Edge Function 并同步运行密钥
        if: env.HAS_SUPABASE == 'true' && steps.changed.outputs.changed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npm install -g supabase
          supabase functions deploy mim-api --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          # 运行密钥：URL 为公开值内联；service_role 与令牌密钥走 secrets。
          # MIM_TOKEN_SECRET 轮换会使全部已签发令牌失效（30 天 TTL），勿频繁更换。
          supabase secrets set \
            "SUPABASE_URL=https://sepfobukokrrivwyvhnd.supabase.co" \
            "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            "MIM_TOKEN_SECRET=${{ secrets.MIM_TOKEN_SECRET }}" \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: 未变更时跳过
        if: env.HAS_SUPABASE == 'true' && steps.changed.outputs.changed != 'true'
        run: echo "supabase/functions/ 本轮无变更，跳过 Edge Function 部署"

  publish-package:
    name: 发布 npm 包到 GitHub Packages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: 准备发布配置
        run: node scripts/prepare-package.mjs "${{ github.repository_owner }}" "${{ github.ref_name }}"

      # 先升级 npm（npm/cli#7678 arborist edgesOut 崩溃，同 build job）
      - name: 安装依赖
        run: |
          npm install -g npm@10.9.9
          npm install --no-fund --no-audit --legacy-peer-deps

      - name: 构建
        run: npm run build
        env:
          # Mim 云端后端地址（CloudBase 云函数 mim-api 的 HTTP 入口，自带 CORS *）。
          # 直接内联而非走 secrets —— 根治「仓库未配 secret → 构建产物缺配置
          # → 永远回退本地演示模式」。
          VITE_MIM_API_BASE: https://cs-1-d5g815slocb5a611a-1320483685.ap-shanghai.app.tcloudbase.com/mim-api
          # Supabase（主后端）公开配置，同 build job（发布产物与站点一致）
          VITE_SUPABASE_URL: https://sepfobukokrrivwyvhnd.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_TV4e4DtFiufiJiY05WSFsQ_2FmlMCUg

      - name: 发布
        # 作用域包（@afdk1991/mim）默认按 private 发布，GitHub Packages 免费套餐仅允许 public → 必须 --access public
        # 凭据：必须用 PAT（secrets.NPM_TOKEN，需 write:packages + read:packages 作用域）。
        # ⚠️ 不要指望 GITHUB_TOKEN 兜底 —— 实测即使包已关联仓库，
        #    GITHUB_TOKEN 仍报 403 permission_denied: write_package（v0.0.4 复现两次）。
        #    用户级公开 npm 包只能用 PAT 发布。
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  verify-deploy:
    name: 线上冒烟验证（Pages + Makers）
    needs: [deploy-pages, deploy-edgeone]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 校验 GitHub Pages
        env:
          PAGE_URL: ${{ needs.deploy-pages.outputs.url }}
        run: |
          echo "Pages 站点：$PAGE_URL"
          # Pages 部署后需等待 CDN 生效，最多轮询 5 分钟
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/idx.html -w '%{http_code}' --max-time 30 "$PAGE_URL" || echo 000)
            if [ "$code" = "200" ] && grep -q 'id="root"' /tmp/idx.html; then ok=1; break; fi
            echo "  [$i] code=$code 等待生效…"
            sleep 10
          done
          if [ "$ok" != "1" ]; then echo "::error::GitHub Pages 未通过校验（非 200 或缺少挂载点）"; exit 1; fi
          echo '  ✅ index.html 200 且含挂载点 id="root"'

          B=$(grep -oE 'index-[A-Za-z0-9_-]+\.js' /tmp/idx.html | head -1)
          if [ -z "$B" ]; then echo "::error::未能在 index.html 中定位入口 bundle"; exit 1; fi
          echo "  入口 bundle：$B"
          # 必须完整下载后再判断体积 —— 此前 curl 被 --max-time 截断导致误判「产物异常」
          bcode=$(curl -s -o /tmp/b.js -w '%{http_code}' --max-time 120 "$PAGE_URL/assets/$B" || echo 000)
          size=$(wc -c < /tmp/b.js)
          echo "  bundle：HTTP=$bcode size=$size"
          if [ "$bcode" != "200" ]; then echo "::error::入口 bundle 不可达"; exit 1; fi
          if [ "$size" -lt 100000 ]; then echo "::error::入口 bundle 体积异常偏小（疑似下载被截断）"; exit 1; fi
          if ! grep -qiE 'supabase|mim-state' /tmp/b.js; then echo "::error::bundle 内未检出应用代码标记"; exit 1; fi
          echo '  ✅ bundle 完整且含应用代码'

      - name: 校验 clean path 兜底（/admin → #/admin）
        env:
          PAGE_URL: ${{ needs.deploy-pages.outputs.url }}
        run: |
          code=$(curl -s -o /tmp/adm.html -w '%{http_code}' --max-time 30 "$PAGE_URL/admin" || echo 000)
          echo "  /admin HTTP=$code"
          # GitHub Pages 对未知路径回退 404.html（我们的兜底页），状态码仍是 404，
          # 但正文必须是 hash 重定向脚本 —— 只看状态码会漏判
          if ! grep -qE 'location\.(hash|replace)|正在跳转' /tmp/adm.html; then
            echo "::error::/admin 未返回 hash 重定向兜底页"; exit 1
          fi
          echo '  ✅ /admin 命中 404.html 兜底重定向'

      - name: 校验 EdgeOne Makers
        env:
          MAKERS_URL: ${{ needs.deploy-edgeone.outputs.url }}
        run: |
          if [ -z "$MAKERS_URL" ]; then
            echo "::warning::未解析到 Makers URL，跳过该项（不影响其他结果）"; exit 0
          fi
          echo "  Makers 域名：${MAKERS_URL%%\?*}"
          ok=0
          for i in $(seq 1 15); do
            code=$(curl -s -o /tmp/mk.html -w '%{http_code}' --max-time 30 "$MAKERS_URL" || echo 000)
            # 预览网关要求浏览器校验 eo_token：curl 请求会拿到 3xx（SSO 网关）→ 视为存活
            case "$code" in
              200|30*) ok=1; break;;
            esac
            echo "  [$i] code=$code 等待生效…"
            sleep 10
          done
          if [ "$ok" != "1" ]; then echo "::error::EdgeOne Makers 未通过校验"; exit 1; fi
          echo '  ✅ Makers 域名可达（200/3xx 均视为存活）'
