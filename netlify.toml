# Netlify 免费层配置（纯静态站点）
# 免费额度：300 构建分钟/月（2026-10 起新账号改 credit 制）；全球 CDN。
# 在 Netlify 控制台关联本仓库，构建命令与发布目录见下；CI 侧 deploy.yml 的 Netlify 步骤按
# Vercel 同款「缺 NETLIFY_AUTH_TOKEN 即 SKIP」模式运行，不阻断主链路。

[build]
  # 根目录为 pnpm monorepo，仅构建前端薄壳
  command = "pnpm --filter @mim/web build"
  # Vite 产物目录
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9.12.0"

# API 反向代理：本站只托管前端薄壳，后端权威终点为腾讯云自建 mim.mixm.top。
# 缺这条规则时前端请求 /api/v1/* 会落到 Netlify 的 404，页面渲染直接 TypeError。
[[redirects]]
  from = "/api/*"
  to = "https://mim.mixm.top/api/:splat"
  status = 200
  force = true

# SPA 深链接回退：所有未知路径返回 index.html，由前端路由接管
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
