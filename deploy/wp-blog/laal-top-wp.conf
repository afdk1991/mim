# WordPress（子比主题）裸域站点块
# 落点：laal.top（授权域名本体）；复用既有 WP 目录 /var/www/bbs.laal.top 与库 bbs_wp。
# 隔离约束：本文件独立于 Mim 的 mim.conf——Mim CI 部署脚本只重装 mim.conf，不触碰本文件；
# 本文件不写 default_server，未登记主机名仍由同机默认站点承接。
# 证书：复用既有泛域名证书（SAN 含 DNS:*.laal.top, DNS:laal.top），不单独签发。

# HTTP：裸域与 www 统一 301 到 HTTPS 裸域，$request_uri 保留原路径与查询串
server {
    listen 80;
    listen [::]:80;
    server_name laal.top www.laal.top;
    return 301 https://laal.top$request_uri;
}

# HTTPS www：规范化到裸域（裸域为 canonical，www 不单独承接内容）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate     /etc/letsencrypt/live/laal.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laal.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WPlaalTLS:10m;
    ssl_session_timeout 1d;
    server_name www.laal.top;
    return 301 https://laal.top$request_uri;
}

# HTTPS 裸域：WordPress + 子比主题，PHP 8.1-FPM 本机 socket
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate     /etc/letsencrypt/live/laal.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laal.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WPlaalTLS:10m;
    ssl_session_timeout 1d;
    server_name laal.top;

    root /var/www/bbs.laal.top;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 64m;

    access_log /var/log/nginx/laal-top-wp.access.log;
    error_log  /var/log/nginx/laal-top-wp.error.log warn;

    # WP 伪静态：真实文件优先，其余回 index.php
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP 交本机 PHP 8.1-FPM 解析
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }

    # 上传目录禁止执行 PHP；配置文件与点文件对外拒绝
    location ~* /(?:uploads|files)/.*\.php$ { deny all; }
    location = /wp-config.php { deny all; }
    location ~ /\.(ht|git|env) { deny all; }
}
