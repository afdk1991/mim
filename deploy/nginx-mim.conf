# Mim 生产站点（nginx）
# 安装位置：/etc/nginx/sites-available/mim.conf，软链到 sites-enabled/
# 静态根：/opt/mim/web（apps/web 的 vite build 产物）
# 后端：services/mim-api（127.0.0.1:8787，由 systemd 托管）
#
# 注意：nginx 的 add_header 采用「整组继承」语义——只要本 location 内写了
# 任意 add_header，父级 server 的全部 add_header 都会失效，故安全头需重复声明。
#
# 域名映射边界（2026-11-08）：本 server 只服务 mim.mixm.top。其余
# *.mixm.top 子域（www / portal / api / mall / gy …）由各自服务承载，DNSPod 解析，
# 不要在此加通配 server_name 吸收其流量。原站点体系（src/site.ts / src/site-nodes.ts
# 与 GET /api/v1/site/nodes）已于 2026-11-08 整体下线删除，本边界约束仍然有效。

server {
    listen 80;
    listen [::]:80;
    server_name mim.mixm.top;

    root /opt/mim/web;
    index index.html;
    charset utf-8;

    client_max_body_size 3m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # 静态资源：长缓存 + 不可变（文件名带 hash）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # 入口 HTML：不缓存，保证发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    # IM WebSocket：/api/v1/im/ws?token=… 需要 Upgrade 头与 HTTP/1.1，
    # 不能复用 /api/ 的 Connection="" 配置，否则握手失败。
    location /api/v1/im/ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s; # 长连接：1 小时无数据才断开，避免心跳被中断
    }

    # 后端 API（proxy_pass 末尾不能带 URI，否则会改写路径）
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 健康检查（供 CI 与运维探活）
    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # 管理后台（apps/admin 构建产物，静态根 /opt/mim/admin，与用户端完全隔离）
    # 裸路径 /admin 无结尾斜杠时 alias 前缀匹配不到，统一 301 到 /admin/
    location = /admin {
        return 301 /admin/;
    }

    # 管理后台静态资源：文件名带 hash，长缓存 + 不可变
    # 用 root 而非 alias：$uri=/admin/assets/x.js 直接拼成 /opt/mim/admin/assets/x.js，
    # 语义清晰且不受 alias 截掉 location 前缀后与 try_files 回退的内部重定向歧义影响。
    location /admin/assets/ {
        root /opt/mim;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # 管理后台入口与前端路由回退：root /opt/mim 把 $uri=/admin/xxx 映射为
    # /opt/mim/admin/xxx；try_files 命中真实文件，未命中回退 /admin/index.html
    # （走一次内部重定向再次匹配本 location，不会落到用户端 location /）。
    location /admin/ {
        root /opt/mim;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /admin/index.html;
    }

    # SPA 回退（前端为单页应用，非 /api 路径回退到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/mim.access.log;
    error_log  /var/log/nginx/mim.error.log warn;
}
