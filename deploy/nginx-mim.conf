# Mim 生产站点（nginx）
# 安装位置：/etc/nginx/sites-available/mim.conf，软链到 sites-enabled/
# 静态根：/opt/mim/web（apps/web 的 vite build 产物）
# 后端：services/mim-api（默认 127.0.0.1:8787，由 systemd 托管）
#
# 端口占位符（由 deploy/deploy.sh 与 deploy/bootstrap.sh 渲染，禁止手改成品）：
#   __MIM_WEB_HTTP_PORT__   前端 HTTP 端口，默认 8088
#   __MIM_WEB_HTTPS_PORT__  前端 HTTPS 端口，默认 443（与同机 MixmAPP 同端口共享监听，不写 default_server）
#   __MIM_API_PORT__        后端回环端口，默认 8787（API 与 WS 共用，无独立 WS 端口）
#   TLS 片段                写在各 server 块内的占位符；证书就绪时注入 HTTPS 监听与证书行，否则保持注释
# 同机共存约束（115.159.159.11 与 MixmAPP 共用一台 CVM）：
#   80 归 MixmAPP，本文件不监听 80；生产实际用 443 与 MixmAPP 共享监听，仅靠 server_name
#   精确匹配区分站点，本文件任何 server 块都不写 default_server（MixmAPP 的隐式默认站点
#   仍是其首个 443 块，语义完全不变）。8088 作为 HTTP 回退入口长期保留，8443 为备用端口。
#   admin 不单独占端口：管理后台是主站同源的 /admin/ 路径，独立端口不会带来额外隔离，
#   反而要多维护一份证书与跨端口 Cookie；健康检查同理走主站端口与回环直连。
#
# 注意：nginx 的 add_header 采用「整组继承」语义——只要本 location 内写了
# 任意 add_header，父级 server 的全部 add_header 都会失效，故安全头需重复声明。
#
# 域名映射边界（2026-11-14 切换为 laal.top 口径）：本 server 服务 laal.top / www.laal.top。
# 其余 *.laal.top 子域按 xlsx「域名适配整个项目laal.top」的用途列分流，规则写在文件末尾：
#   - api.laal.top  → 直接反代 127.0.0.1:__MIM_API_PORT__（API 网关，前端 VITE_API_ORIGIN 指向它）
#   - 其余已实现功能的子域 → 301 到主站对应前端路由（SPA 不按 host 分流，故用跳转落地）
# 不要在此加通配 server_name 吸收子域流量：未登记的子域应保持 NXDOMAIN，避免出现伪页面。
# 原站点体系（src/site.ts / src/site-nodes.ts 与 GET /api/v1/site/nodes）已于 2026-11-08 整体移除。

server {
    listen __MIM_WEB_HTTP_PORT__;
    listen [::]:__MIM_WEB_HTTP_PORT__;
    __MIM_TLS_CONF__
    server_name laal.top www.laal.top;

    root /opt/mim/web;
    index index.html;
    charset utf-8;

    client_max_body_size 3m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP 说明（2026-11-15 起改为构建自动生成，不再手写哈希）：
    # 内联脚本「地址栏前置规整」的内容哈希由 scripts/csp-inline-hash.mjs 在 vite build 之后算出，
    # 写进产物 apps/web/dist/mim-csp.conf，随 dist 一起发布到 /opt/mim/web，再由下面的通配 include 引用。
    # 历史教训：哈希靠人手同步时，改了内联脚本就会漂移，CSP 不匹配 → 脚本被拦 → 多段深链接白屏；
    # 现在「产物算什么，响应头就发什么」。通配 include 在文件缺失时不会让 nginx -t 失败
    # （全新机器 bootstrap 阶段还没有构建产物），此时站点降级为不带 CSP，而不是启动失败。
    include /opt/mim/web/mim-csp*.conf; # 等价于原先手写的那条 add_header Content-Security-Policy

    # 静态资源：长缓存 + 不可变（文件名带 hash）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        include /opt/mim/web/mim-csp*.conf; # CSP 由构建生成（见文件头 server 块说明），避免哈希与产物漂移
        try_files $uri =404;
    }

    # 入口 HTML：不缓存，保证发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        include /opt/mim/web/mim-csp*.conf; # CSP 由构建生成（见文件头 server 块说明），避免哈希与产物漂移
    }

    # IM WebSocket：/api/v1/im/ws?token=… 需要 Upgrade 头与 HTTP/1.1，
    # 不能复用 /api/ 的 Connection="" 配置，否则握手失败。
    location /api/v1/im/ws {
        proxy_pass http://127.0.0.1:__MIM_API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s; # 长连接：1 小时无数据才断开，避免心跳被中断
    }

    # 后端 API（proxy_pass 末尾不能带 URI，否则会改写路径）
    location /api/ {
        proxy_pass http://127.0.0.1:__MIM_API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 健康检查（供 CI 与运维探活）
    location = /health {
        proxy_pass http://127.0.0.1:__MIM_API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # 管理后台（apps/admin 构建产物，静态根 /opt/mim/admin，与用户端完全隔离）
    # 裸路径 /admin 无结尾斜杠时 alias 前缀匹配不到，统一 301 到 /admin/
    location = /admin {
        return 301 /admin/;
    }

    # 管理后台静态资源：文件名带 hash，长缓存 + 不可变
    # 用 root 而非 alias：$uri=/admin/assets/x.js 直接拼成 /opt/mim/admin/assets/x.js，
    # 语义清晰且不受 alias 截掉 location 前缀后与 try_files 回退的内部重定向歧义影响。
    location /admin/assets/ {
        root /opt/mim;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        include /opt/mim/web/mim-csp*.conf; # CSP 由构建生成（见文件头 server 块说明），避免哈希与产物漂移
        try_files $uri =404;
    }

    # 管理后台入口与前端路由回退：root /opt/mim 把 $uri=/admin/xxx 映射为
    # /opt/mim/admin/xxx；try_files 命中真实文件，未命中回退 /admin/index.html
    # （走一次内部重定向再次匹配本 location，不会落到用户端 location /）。
    location /admin/ {
        root /opt/mim;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        include /opt/mim/web/mim-csp*.conf; # CSP 由构建生成（见文件头 server 块说明），避免哈希与产物漂移
        try_files $uri $uri/ @admin_spa;
    }

    # 管理后台的 SPA 回退：与用户端同一口径 —— 带扩展名的缺失资源必须 404，
    # 只有无扩展名路径才回落到 /admin/index.html，避免把 HTML 当 JS/CSS 返回。
    # 注意命名 location 不继承 /admin/ 里的 root，必须自己再声明一次。
    location @admin_spa {
        root /opt/mim; # 与 /admin/ 同根：$uri=/admin/index.html 映射到 /opt/mim/admin/index.html
        if ($uri ~* "\.[A-Za-z0-9]+$") { # 路径最后一段带扩展名：判定为静态资源请求
            return 404; # 资源不存在就返回 404
        } # 带扩展名分支结束
        rewrite ^ /admin/index.html last; # 无扩展名：内部重定向回管理后台入口，复用其响应头
    }

    # 旧路径段永久重定向（2026-11-11 对外地址统一改为模块功能名称）：
    # 旧链接 / 旧书签 / 外部引用按 301 落到新路径；前端 router.ts 的 LEGACY_SEGMENTS 再做一次兜底，
    # 保证未走 nginx 的平台（静态托管回退到 index.html）也拿到同样的新地址。
    location = /store {
        return 301 /community;
    }

    location = /sites {
        return 301 /community;
    }

    location = /comic {
        return 301 /community;
    }

    # 2026-11-15 公告动态并入社区：旧链接 301 到 /community，不留 404、不落回已删除页面
    location = /announcements {
        return 301 /community;
    }

    # 2026-11-15 资讯 / 版本并入社区、购物车并入个人中心：旧地址 301 落到新落点
    location = /news {
        return 301 /community;
    }

    location = /releases {
        return 301 /community;
    }

    location = /cart {
        return 301 /account?tab=cart;
    }

    location = /login {
        return 301 /signin;
    }

    # SPA 回退：只对「无扩展名」的路径回落到 index.html（前端路由刷新用）。
    # 带扩展名的请求（.js/.css/图片等）缺失时必须 404，不能兜底成 HTML——
    # 否则浏览器会把 HTML 当模块解析，报 MIME 错误并白屏（2026-11-15 P0 白屏的第二条证据链）。
    location / {
        try_files $uri $uri/ @spa;
    }

    # 真正执行回落的命名 location：先按扩展名分流，再走一次内部重定向回到 = /index.html
    # （重定向而不是直接 try_files，是为了复用该 location 的 no-cache 与安全头）。
    location @spa {
        if ($uri ~* "\.[A-Za-z0-9]+$") { # 路径最后一段带扩展名：判定为静态资源请求
            return 404; # 资源确实不存在，如实返回 404，绝不返回入口 HTML
        } # 带扩展名分支结束
        rewrite ^ /index.html last; # 无扩展名：内部重定向到入口，交给 = /index.html 处理
    }

    access_log /var/log/nginx/mim.access.log;
    error_log  /var/log/nginx/mim.error.log warn;
}

# API 网关子域：表内 api = 「接口服务入口｜API 统一网关」。
# 前端 VITE_API_ORIGIN、镜像站反代、CI 认证抽查都用 https://api.laal.top，
# 因此该主机必须在生产 nginx 上独立承接，否则切域后所有 /api/v1 调用会打到主站静态根。
# 只监听 __MIM_WEB_HTTP_PORT__ / __MIM_WEB_HTTPS_PORT__：TLS 片段由 deploy.sh 按证书是否就绪注入
# （证书缺失时保持注释，nginx 仍能通过 -t 校验，不会因缺 pem 启动失败）。
server {
    listen __MIM_WEB_HTTP_PORT__;
    listen [::]:__MIM_WEB_HTTP_PORT__;
    __MIM_TLS_CONF__
    server_name api.laal.top;

    client_max_body_size 3m;

    # WebSocket 与主站同规则（Upgrade 头 + HTTP/1.1），不能复用 Connection ""
    location /api/v1/im/ws {
        proxy_pass http://127.0.0.1:__MIM_API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:__MIM_API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:__MIM_API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # 非 API 路径统一回主站，避免 api 子域被当成第二个站点
    location / {
        return 301 https://laal.top:__MIM_WEB_HTTPS_PORT__/;
    }

    access_log /var/log/nginx/mim-api.access.log;
    error_log  /var/log/nginx/mim-api.error.log warn;
}

# 功能子域：表内用途列已有实现、但前端是单页应用（router.ts 不按 host 分流），
# 故以 301 落到主站对应前端路由，而不是为每个子域复制一套静态产物。
#   admin → /admin/（管理后台，与用户端隔离）      center → /account（个人中心）
#   auth / login → /signin（统一登录）              pay → /checkout（收银台）
#   已下线模块的旧子域（dh / gy / mall / video）统一 301 回社区首页，不再指向已删除页面。
# 表内其余子域（blog / news / portal …）在项目里无实现，不在此登记，保持 NXDOMAIN。
server {
    listen __MIM_WEB_HTTP_PORT__;
    listen [::]:__MIM_WEB_HTTP_PORT__;
    __MIM_TLS_CONF__
    server_name admin.laal.top center.laal.top auth.laal.top login.laal.top dh.laal.top gy.laal.top mall.laal.top pay.laal.top video.laal.top;

    if ($host = admin.laal.top)  { return 301 https://laal.top:__MIM_WEB_HTTPS_PORT__/admin/; }
    if ($host = center.laal.top) { return 301 https://laal.top:__MIM_WEB_HTTPS_PORT__/account; }
    if ($host = auth.laal.top)   { return 301 https://laal.top:__MIM_WEB_HTTPS_PORT__/signin; }
    if ($host = login.laal.top)  { return 301 https://laal.top:__MIM_WEB_HTTPS_PORT__/signin; }
    if ($host = dh.laal.top)     { return 301 https://laal.top:__MIM_WEB_HTTPS_PORT__/community; }
    if ($host = gy.laal.top)     { return 301 https://laal.top:__MIM_WEB_HTTPS_PORT__/community; }
    if ($host = mall.laal.top)   { return 301 https://laal.top:__MIM_WEB_HTTPS_PORT__/community; }
    if ($host = pay.laal.top)    { return 301 https://laal.top:__MIM_WEB_HTTPS_PORT__/checkout; }
    if ($host = video.laal.top)  { return 301 https://laal.top:__MIM_WEB_HTTPS_PORT__/community; }

    # 兜底：未命中上面任一主机的请求回主站
    return 301 https://laal.top:__MIM_WEB_HTTPS_PORT__/;

    access_log /var/log/nginx/mim-subdomain.access.log;
    error_log  /var/log/nginx/mim-subdomain.error.log warn;
}

# 文档站：help.laal.top 托管仓库 help/ 目录的纯静态文档（index.html + content/help.json）。
# 独立静态根 /opt/mim/help，与用户端 SPA 产物（/opt/mim/web）完全分离，
# 任一方重新发布都不会冲掉另一方；该站没有前端路由，也就不需要 SPA 回退。
# 证书无需单独签发：laal.top 的 *.laal.top 泛域名证书已覆盖本主机。
server {
    listen __MIM_WEB_HTTP_PORT__;
    listen [::]:__MIM_WEB_HTTP_PORT__;
    __MIM_TLS_CONF__
    server_name help.laal.top;

    root /opt/mim/help;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 纯静态站点：只命中真实文件，缺失一律 404（绝不做 HTML 兜底）
    location / {
        try_files $uri $uri/ =404;
    }

    # 内容 JSON 每次取最新，避免文档更新后读者仍读到旧文案
    location = /content/help.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    access_log /var/log/nginx/mim-help.access.log;
    error_log  /var/log/nginx/mim-help.error.log warn;
}
