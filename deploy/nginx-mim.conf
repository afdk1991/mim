# Mim —— nginx 站点配置
#
# 安装（Debian/Ubuntu）：
#   sudo cp deploy/nginx-mim.conf /etc/nginx/sites-available/mim
#   sudo ln -s /etc/nginx/sites-available/mim /etc/nginx/sites-enabled/mim
#   sudo nginx -t && sudo systemctl reload nginx
#
# 职责分工：静态资源由 nginx 直出，/api 前缀反向代理到本机 8787 的后端。

server {
    listen 80;
    listen [::]:80;
    server_name _;              # 部署时替换为真实域名

    # 前端构建产物（vite build 输出，vite.config.ts 里 base: './'）
    root /opt/mim/dist;
    index index.html;

    # gzip：Vite 产物里 JS/CSS 未预压缩，开启后首屏体积约降到 1/3。
    # text/html 由 nginx 默认 gzip_types 覆盖，无需重复声明。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # 安全响应头（放在 server 级，作为默认值）。
    # 【nginx 陷阱】add_header 不叠加而是"整组继承"：子级 location 只要自己写了
    # 任意一条 add_header，server 级的全部 add_header 就都不再下发。
    # 所以下面 /assets/ 和 = /index.html 两处必须把这些头重复一遍，否则那两个
    # 最高频的响应会静默丢掉安全头（用 curl -I 才能看出来）。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP：本应用无内联脚本（index.html 只引用 /src/main.tsx 打包产物），
    # 故 script-src 不给 'unsafe-inline'；样式允许内联（CSS-in-JS 的 style 属性）。
    # connect-src 放开 https:，兼容前端直连跨域后端（VITE_MIM_API_BASE 填绝对地址）的部署形态。
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # 前端是自研 hash 路由（#/xxx），服务端永远只收到 /，
    # 但仍然加 try_files 兜底，防止将来切换 history 模式或访问 /privacy.html 之类的静态页 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 content-hash 的产物可以长缓存（“指南所说的immutable”）
    location /assets/ {
        expires 1y;
        # 这三条安全头必须重复：本块一旦有 add_header，server 级的会被整组丢弃
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
        try_files $uri =404;
    }

    # index.html 与 favicon 不能被缓存死，否则发版后用户拿到旧页面
    location = /index.html {
        # 同上：安全头在这里必须重复，不能依赖 server 级继承
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    }

    # 反向代理后端。
    # 【关键】proxy_pass 末尾不能带 URI（不能写成 http://127.0.0.1:8787/），
    # 否则 nginx 会把 /api/xxx 重写成 /xxx，后端要求所有接口保留 /api 前缀，会全部 404。
    location /api/ {
        proxy_pass http://127.0.0.1:8787;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 上传最大 3MB（与前端 LIMITS.uploadMaxBytes、后端 UPLOAD_MAX_BYTES 保持一致）
        client_max_body_size 3m;
    }

    access_log /var/log/nginx/mim.access.log;
    error_log  /var/log/nginx/mim.error.log warn;
}
