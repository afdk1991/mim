# Mim —— nginx 日志轮转
#
# 安装：
#   sudo cp deploy/logrotate-mim.conf /etc/logrotate.d/mim
#   sudo logrotate -d /etc/logrotate.d/mim    # 干跑验证，无误后再等 cron 自动执行
#
# 说明：后端日志走 journald（systemctl 由单元文件的 StandardOutput=journal 指定），
# 不落文件，因此这里只轮转 nginx 的访问/错误日志。journald 的体积限制见 README.md「日志」一节。
#
# SD-008：属主组用占位符，由 install.sh 按发行版 sed 替换——
#   Debian/Ubuntu → www-data:adm
#   RHEL/CentOS  → nginx:nginx（无 adm 组，www-data 属主也不存在，直接 cp 会轮转报错）
# 手动安装时请把下面两个占位符替换成对应发行版的 nginx 运行账号。

/var/log/nginx/mim.*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 @LOG_OWNER@ @LOG_GROUP@
    sharedscripts
    postrotate
        # 让 nginx 重新打开日志文件（不做 reload，不断连接）
        if [ -f /run/nginx.pid ]; then
            kill -USR1 "$(cat /run/nginx.pid)"
        fi
    endscript
}
