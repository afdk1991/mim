# Sealos 部署清单：API（ghcr 镜像）+ 持久卷（SQLite）+ Service + Ingress
#
# 镜像由 GitHub Actions 的 packages job 推送到 ghcr.io/afdk1991/mim-api:latest。
# 数据库为持久化 PVC（mim-data），挂载到 /app/services/mim-api/data（与 config.ts 的 DATA_DIR 一致）。
#
# 安全提示：替换只在管道内传给 kubectl，禁止把含真实密钥的结果写回本文件或提交仓库；
# __JWT_SECRET__ 必须始终保持占位符形态，真实值只从环境变量注入（清单内 value 为占位符，非明文密钥）。
# 应用前需替换 __NAMESPACE__ / __JWT_SECRET__ / __DOMAIN__ 三个占位符：
#   sed -e "s/__NAMESPACE__/$SEALOS_NAMESPACE/g" \
#       -e "s/__JWT_SECRET__/$MIM_JWT_SECRET/g" \
#       -e "s/__DOMAIN__/$SEALOS_DOMAIN/g" \
#     deploy/sealos/mim.yaml | kubectl apply -f -
#
# 注意：Sealos Cloud 分配给用户的 ServiceAccount 只有自身命名空间（ns-xxxx）的权限，
# 无法创建 Namespace，因此本清单不再自建命名空间，直接部署到 kubeconfig 所属命名空间。

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mim-data
  namespace: __NAMESPACE__
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mim-api
  namespace: __NAMESPACE__
  labels:
    app: mim-api
spec:
  replicas: 1
  # SQLite 为单写者，副本数必须为 1，避免多实例写坏数据库
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mim-api
  template:
    metadata:
      labels:
        app: mim-api
    spec:
      containers:
        - name: mim-api
          image: ghcr.io/afdk1991/mim-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8787"
            - name: MIM_JWT_SECRET
              value: "__JWT_SECRET__"
            - name: MIM_CORS_ORIGINS
              value: "https://__DOMAIN__"
          volumeMounts:
            - name: data
              mountPath: /app/services/mim-api/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mim-data
---
apiVersion: v1
kind: Service
metadata:
  name: mim-api
  namespace: __NAMESPACE__
spec:
  selector:
    app: mim-api
  ports:
    - name: http
      port: 8787
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mim
  namespace: __NAMESPACE__
  annotations:
    # 对齐 Sealos 内置应用的 Ingress 形态：使用 class 注解而非 spec.ingressClassName
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  # Sealos 网关以 *.cloud.sealos.io 通配证书统一终结 TLS
  tls:
    - hosts:
        - __DOMAIN__
      secretName: wildcard-cloud-sealos-io-cert
  rules:
    - host: __DOMAIN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mim-api
                port:
                  number: 8787
