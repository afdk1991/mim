# Cloudflare Pages 项目名统一为 mim（与项目名 Mim 对齐），须与账号内实际项目一致，
# 否则 wrangler pages deploy 找不到项目会直接失败。
# 该项目的访问域名是 mim-299.pages.dev（Pages 子域全局唯一，mim.pages.dev 已被他人占用）。
name = "mim"
compatibility_date = "2026-11-01"
pages_build_output_dir = "apps/web/dist"

# Cloudflare Pages：构建命令 pnpm --filter @mim/web build，产物 apps/web/dist。
# 同源 /api 请求由 functions/api/[[path]].js 反代到生产 API（见该文件），
# 因此前端无需在 Cloudflare 侧注入 VITE_API_ORIGIN。
