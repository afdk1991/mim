# =============================================================================
# 加固覆盖层：docker compose -f docker-compose.yml -f docker-compose.hardened.yml up -d
#   目标：把「不可信函数」的爆炸半径压到最小；同时约束所有有状态服务的能力。
#   注意：read_only 会让 Deno 无法写缓存，因此显式把 DENO_DIR 指到 tmpfs。
#        若你的函数确实需要落盘，请去掉对应服务的 read_only 与 tmpfs 行。
# =============================================================================
services:
  functions:
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    environment:
      DENO_DIR: /tmp/deno
      DENO_NO_UPDATE_CHECK: "1"
    pids_limit: 200
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  storage:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  auth:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  rest:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  realtime:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  meta:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  imgproxy:
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
