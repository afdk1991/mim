# =============================================================================
# 自托管 BaaS · 单节点编排
#   启动：make up      （等价于 docker compose up -d）
#   可选 profile： s3（MinIO 对象存储） | studio（管理台）
#   所有镜像版本集中在 .env，pull 失败时只改 .env 即可
# =============================================================================
name: mim-baas

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # ---------------------------------------------------------------- Postgres
  # 唯一真相源：所有模块都只是「Postgres 的一种读取方式」
  db:
    <<: *common
    image: ${POSTGRES_IMAGE}
    container_name: baas-db
    # 若换成官方 postgres 镜像（而非 supabase/postgres），必须放开下面这行：
    # command: postgres -c wal_level=logical -c max_replication_slots=20 -c max_wal_senders=32 -c max_slot_wal_keep_size=${MAX_SLOT_WAL_KEEP_SIZE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # 复制槽保留上限，防止 Realtime 断连后 WAL 无限堆积
      MAX_SLOT_WAL_KEEP_SIZE: ${MAX_SLOT_WAL_KEEP_SIZE}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # 挂载整个 db 目录，供 scripts/migrate.sh 在容器内 psql -f 执行迁移
      - ./db:/db:ro
      - db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ------------------------------------------------------------------- Auth
  # gotrue：邮箱密码 / 魔法链接 / 第三方 OAuth，签发 JWT 给下游所有模块
  auth:
    <<: *common
    image: ${AUTH_IMAGE}
    container_name: baas-auth
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 9999
      API_HOST: 0.0.0.0
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL}
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP}
      # JWT
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      # DB（gotrue 自行在 auth schema 建表）
      GOTRUE_DB_DRIVER: postgres
      DB_DRIVER: postgres
      DB_NAMESPACE: auth
      DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # 邮件（魔法链接 / 找回密码依赖它；联调可先开 AUTOCONFIRM）
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM}
      GOTRUE_MAILER_URL_PREFIXES: ${SITE_URL}/auth/v1
      GOTRUE_MAILER_OTP_EXP: ${GOTRUE_MAILER_OTP_EXP}
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "确认你的邮箱"
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: "登录链接"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "重置密码"
      GOTRUE_MAILER_SUBJECTS_INVITE: "邀请你加入"
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_SENDER_NAME: ${GOTRUE_SMTP_SENDER_NAME}
      # OAuth：回调地址固定 ${SITE_URL}/auth/v1/callback
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GOTRUE_EXTERNAL_GITHUB_ENABLED}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GOTRUE_EXTERNAL_GITHUB_CLIENT_ID}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GOTRUE_EXTERNAL_GITHUB_SECRET}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${SITE_URL}/auth/v1/callback
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOTRUE_EXTERNAL_GOOGLE_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${SITE_URL}/auth/v1/callback

  # --------------------------------------------------------------- PostgREST
  # 库内解析 HTTP → SQL，schema 即 API；JWT 中的 role 决定以哪个 PG 角色执行（RLS 生效）
  rest:
    <<: *common
    image: ${REST_IMAGE}
    container_name: baas-rest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_AGGREGATES_ENABLED: "true"
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_MAX_ROWS: 1000
      PGRST_OPENAPI_SERVER_PROXY_URI: ${SITE_URL}/rest/v1
      PGRST_DB_PLAN_ENABLED: "true"
    # 迁移后必须 notify 才会刷新 schema cache，否则报“表不存在”的假故障：make reload

  # ---------------------------------------------------------------- Realtime
  # 逻辑复制 WAL → WebSocket；RLS 在库内复算，不信任客户端传来的任何身份
  realtime:
    <<: *common
    image: ${REALTIME_IMAGE}
    container_name: baas-realtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      APP_NAME: realtime
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: realtime-encryption-key-change-me
      API_JWT_SECRET: ${JWT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      SECURE_CHANNELS: "true"
      SLOT_NAME: supabase_realtime_rls
      TEMP_SLOT: "true"
      MAX_REPLICATION_LAG_MB: 512
      REGION: local
      RLIMIT_NOFILE: 10000

  # ----------------------------------------------------------------- Storage
  # 元数据在 PG（受 RLS 约束），字节流在本地卷或 S3
  storage:
    <<: *common
    image: ${STORAGE_IMAGE}
    container_name: baas-storage
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT}
      STORAGE_BACKEND: ${STORAGE_BACKEND}
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      IS_MULTI_TENANT: "false"
      UPLOAD_SIGNED_URL_EXPIRATION_TIME: "120"
      # 图片变换
      ENABLE_IMAGE_TRANSFORMATION: ${ENABLE_IMAGE_TRANSFORMATION}
      IMGPROXY_URL: http://imgproxy:5001
      IMGPROXY_REQUEST_LIMIT: "50"
      # STORAGE_BACKEND=s3 时生效
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
    volumes:
      - ./volumes/storage:/var/lib/storage

  imgproxy:
    <<: *common
    image: ${IMGPROXY_IMAGE}
    container_name: baas-imgproxy
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
      IMGPROXY_USE_ETAG: "true"

  # ------------------------------------------------------------ Postgres Meta
  meta:
    <<: *common
    image: ${META_IMAGE}
    container_name: baas-meta
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  # --------------------------------------------------------- Edge Functions
  # Deno serverless：单一 main 服务，内部按路径路由到各函数
  functions:
    <<: *common
    image: ${EDGE_IMAGE}
    container_name: baas-functions
    command:
      - start
      - --main-service
      - /home/deno/functions/main
      - --port
      - "8081"
    environment:
      SUPABASE_URL: ${FUNCTIONS_INTERNAL_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      JWT_SECRET: ${JWT_SECRET}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
    volumes:
      - ./functions:/home/deno/functions:ro

  # ----------------------------------------------------------------- Gateway
  # Envoy 按路径分发；Realtime 走 WebSocket upgrade
  envoy:
    <<: *common
    image: ${ENVOY_IMAGE}
    container_name: baas-envoy
    depends_on:
      - auth
      - rest
      - realtime
      - storage
      - functions
    ports:
      - "${GATEWAY_PORT}:8000"
      - "9901:9901"   # Envoy admin（生产建议只监听 127.0.0.1 或不映射）
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro

  # ============================ 可选 profile ============================
  minio:
    <<: *common
    image: ${MINIO_IMAGE}
    container_name: baas-minio
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data

  studio:
    <<: *common
    image: ${STUDIO_IMAGE}
    container_name: baas-studio
    profiles: ["studio"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_URL: http://envoy:8000
      SUPABASE_PUBLIC_URL: ${SITE_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}

volumes:
  db-data:
  minio-data:
