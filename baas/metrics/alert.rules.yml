# BaaS 告警规则（--profile metrics）
# 说明：没有 Alertmanager 时，Prometheus 只会在 /alerts 页面显示 firing，
# 需要真正推送通知请再加 alertmanager 服务并配置 receivers。
groups:
  - name: baas-realtime
    rules:
      - alert: ReplicationSlotLagHigh
        expr: pg_replication_slots_lag_bytes > 536870912
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "复制槽滞后超过 512MB（slot {{ $labels.slot_name }}）"
          description: "Realtime 消费端落后或断连，WAL 正在堆积。检查 realtime 容器与 publication 配置。"

      - alert: ReplicationSlotInactive
        expr: pg_replication_slots_active == 0
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "复制槽无消费端（slot {{ $labels.slot_name }}）"
          description: "无消费者时 WAL 会一直保留，务必同时确认 max_slot_wal_keep_size 已设上限。"

      - alert: SlotKeepSizeUnlimited
        expr: pg_replication_slots_keep_size_bytes == 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "max_slot_wal_keep_size 未限制"
          description: "断连时 WAL 无上限增长，存在撑爆磁盘风险。"

  - name: baas-postgres
    rules:
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "postgres_exporter 不可达，数据库可能已宕"

      - alert: ConnectionsNearMax
        expr: >
          sum(pg_stat_activity_count) / on(instance) group_left
          max(pg_settings_max_connections) > 0.8
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "连接数接近上限（>80%）"
          description: "未启用连接池时多由 PostgREST / 应用直连造成，建议启用 --profile pooler。"

      - alert: LongRunningTx
        expr: max(pg_stat_activity_max_tx_duration) > 3600
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "存在超过 1 小时的长事务"
          description: "长事务会阻塞 autovacuum 并放大 WAL 体积。"
