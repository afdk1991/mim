# Prometheus 配置（--profile metrics）
# 只采集 BaaS 自身必要的指标；告警规则见 alert.rules.yml
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# 需要更多维度（容器 CPU / 内存 / 磁盘）时加 cadvisor 或 node-exporter；
# 磁盘告警强烈建议补 node-exporter —— WAL 堆积最终表现为磁盘耗尽
