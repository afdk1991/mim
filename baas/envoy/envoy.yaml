# =============================================================================
# 自托管 BaaS · Envoy 网关
#   七类流量按前缀分发；本文件引用的服务名必须与 docker-compose.yml 完全一致，
#   scripts/verify.mjs 会做交叉核对。
# =============================================================================
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: listener_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                # Realtime 依赖它做 WebSocket 升级
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: local_routes
                  virtual_hosts:
                    - name: baas
                      domains: ["*"]
                      routes:
                        # 网关自身健康检查
                        - match: { prefix: "/health" }
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"status":"ok","service":"baas-gateway"}'
                        # 1. Auth
                        - match: { prefix: "/auth/v1" }
                          route:
                            cluster: auth
                            timeout: 0s
                            prefix_rewrite: "/"
                        # 2. REST（PostgREST）
                        - match: { prefix: "/rest/v1" }
                          route:
                            cluster: rest
                            timeout: 0s
                        # 3. GraphQL（经 PostgREST 的 rpc/graphql 桥接，复用 JWT→RLS 链路）
                        - match: { prefix: "/graphql/v1" }
                          route:
                            cluster: rest
                            timeout: 0s
                            prefix_rewrite: "/rpc/graphql"
                        # 4. Realtime（WebSocket）
                        - match: { prefix: "/realtime/v1" }
                          route:
                            cluster: realtime
                            timeout: 0s
                        # 5. Storage
                        - match: { prefix: "/storage/v1" }
                          route:
                            cluster: storage
                            timeout: 0s
                        # 6. Edge Functions
                        - match: { prefix: "/functions/v1" }
                          route:
                            cluster: functions
                            timeout: 0s
                            prefix_rewrite: "/"
                        # 7. Postgres Meta（内网管理面，生产应在网关层加白名单）
                        - match: { prefix: "/pg/meta" }
                          route:
                            cluster: meta
                            timeout: 0s
                            prefix_rewrite: "/"
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: auth
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 5s
      load_assignment:
        cluster_name: auth
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: auth, port_value: 9999 }

    - name: rest
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 5s
      load_assignment:
        cluster_name: rest
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: rest, port_value: 3000 }

    - name: realtime
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 5s
      # WebSocket 长连接，关闭 HTTP/2 的严格超时
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
      load_assignment:
        cluster_name: realtime
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: realtime, port_value: 4000 }

    - name: storage
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 5s
      load_assignment:
        cluster_name: storage
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: storage, port_value: 5000 }

    - name: meta
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 5s
      load_assignment:
        cluster_name: meta
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: meta, port_value: 8080 }

    - name: functions
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 5s
      load_assignment:
        cluster_name: functions
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: functions, port_value: 8081 }
